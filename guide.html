<style>
  :root {
    --bg:#070912; --ink:#eceffa; --muted:#8d95b2;
    --gold:#e3c07d; --gold-lt:#f7e3b8; --violet:#6b5cff; --cyan:#49d8d0;
    --line:rgba(255,255,255,.10); --surface:rgba(255,255,255,.035);
  }
  * { box-sizing: border-box; }
  body { font-family: 'Zen Kaku Gothic New', 'Outfit', system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; background:var(--bg); color:var(--ink); }

  .links a { color: var(--gold); text-decoration:none; }
  .links a:hover { color: var(--gold-lt); text-decoration:underline; }
  summary.section-toggle { cursor:pointer; font-size:15px; font-weight:700; margin:16px 0 10px; color: var(--ink); }
  .notice { background:rgba(227,192,125,.08); border:1px solid rgba(227,192,125,.35); border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:16px; color: var(--ink); }
  .tab-buttons { display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; padding-bottom:4px; }
  .tab-btn { flex-shrink:0; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; font-size:13px; font-family:inherit; }
  .tab-btn.active { background:var(--gold); border-color:var(--gold); color:#1a1506; font-weight:700; }
  .controls { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  input[type=search] { padding:7px 12px; border:1px solid var(--line); border-radius:10px; font-size:13px; min-width:220px; font-family:inherit; background:var(--surface); color:var(--ink); }
  input[type=search]::placeholder { color: var(--muted); }
  input[type=search]:focus { outline:none; border-color:var(--gold); }
  .badge { display:inline-flex; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid var(--gold); color:var(--gold-lt); }
  .empty { color: var(--muted); }
  .entry { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 14px; margin-bottom:8px; }
  .entry summary { cursor:pointer; font-size:14px; color:var(--ink); }
  .entry-stats { font-size:13px; color:var(--muted); margin-top:8px; line-height:1.7; }

  .guide-section { margin-bottom:18px; }
  .guide-section h2 { font-size:15px; margin:0 0 8px; color:var(--ink); }
  .guide-section h3 { font-size:13px; color:var(--muted); margin:12px 0 6px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }

  <script id="page-data" type="application/json">{"rows":[{"id":"h001","unlockStage":1,"majorCategory":"はじめに","minorCategory":"モンスターポート(建築用)","title":"ポートを置く","body":"もらった『モンスターポート』を、周りの開けた場所に置こう。ここが建築の起点になる。"},{"id":"h002","unlockStage":1,"majorCategory":"はじめに","minorCategory":"モンスターポート(建築用)","title":"ペットを収容する","body":"右クリックでGUIを開き、近くのペットをダブルクリックして中に収容する。"},{"id":"h003","unlockStage":1,"majorCategory":"はじめに","minorCategory":"モンスターポート(建築用)","title":"建築資材チェスト","body":"ポートの真上に出る『建築資材チェスト』を開き、『向き』ボタンで建てる方角(北/東/南/西)を選ぶ。青い枠が建つ場所に出る。"},{"id":"h004","unlockStage":1,"majorCategory":"はじめに","minorCategory":"モンスターポート(建築用)","title":"建築のはじめ方","body":"施設アイテムをスロットへ入れて『建築』ボタンを押す。『ホーム』を手に持ってポートを右クリックしても始められる。"},{"id":"h005","unlockStage":1,"majorCategory":"はじめに","minorCategory":"モンスターポート(建築用)","title":"整地と建築","body":"まずペットが場所を整地する(壊した物はチェストへ)。整地が終わると、資材を運んで少しずつ建ててくれる。"},{"id":"h006","unlockStage":1,"majorCategory":"はじめに","minorCategory":"モンスターポート(建築用)","title":"建てられない場所","body":"宝箱や岩盤など、壊せない大切なブロックがある場所には建てられない。"},{"id":"h007","unlockStage":1,"majorCategory":"はじめに","minorCategory":"モンスターポート(建築用)","title":"次の解放","body":"ホームを建てると『モンスターポート(鍛冶用)』がもらえる。"},{"id":"h008","unlockStage":2,"majorCategory":"はじめに","minorCategory":"モンスターポート(鍛冶用)","title":"鍛冶ポートの使い方","body":"鍛冶用のポートを置き、ペットを収容する。GUIの一覧から作りたい物を選ぶと、素材は手持ちと周りのチェストから自動で集まる。"},{"id":"h009","unlockStage":2,"majorCategory":"はじめに","minorCategory":"モンスターポート(鍛冶用)","title":"鍛冶Lvと仕上がり","body":"収容したペットの鍛冶Lvが高いほど、良い物ができやすい。"},{"id":"h010","unlockStage":2,"majorCategory":"はじめに","minorCategory":"モンスターポート(鍛冶用)","title":"採掘担当","body":"担当を決めると、採掘で鉱石も集めてくれる。"},{"id":"h011","unlockStage":2,"majorCategory":"はじめに","minorCategory":"モンスターポート(鍛冶用)","title":"次の解放","body":"何か1つ作ると『モンスターポート(農業用)』がもらえる。"},{"id":"h012","unlockStage":3,"majorCategory":"はじめに","minorCategory":"モンスターポート(農業用)","title":"農業ポートの使い方","body":"農業用のポートを置き、ペットを収容する。範囲の中をペットが耕し、水をひき、種をまいて育ててくれる。"},{"id":"h012b","unlockStage":3,"majorCategory":"はじめに","minorCategory":"モンスターポート(農業用)","title":"畑の上を空ける","body":"畑の上は10マス空けておく。この高さの中にある物はペットが撤去する（家の床を下に作ると、床がはがされる）。"},{"id":"h013","unlockStage":3,"majorCategory":"はじめに","minorCategory":"モンスターポート(農業用)","title":"種と肥料","body":"種はポートかチェストに入れておく。肥料を入れると品質が上がる。"},{"id":"h014","unlockStage":3,"majorCategory":"はじめに","minorCategory":"モンスターポート(農業用)","title":"担当を決める","body":"担当(種まき/水やり/収穫)を決めると、それぞれの効果が乗る。"},{"id":"h015","unlockStage":3,"majorCategory":"はじめに","minorCategory":"モンスターポート(農業用)","title":"次の解放","body":"種がまかれると『大きな袋』がもらえる。"},{"id":"h016","unlockStage":4,"majorCategory":"はじめに","minorCategory":"大きな袋","title":"袋の使い方","body":"手に持って右クリックで開く。540スロットも入る大容量で、中は分類ごとのタブに分かれている。"},{"id":"h017","unlockStage":4,"majorCategory":"はじめに","minorCategory":"大きな袋","title":"自動回収","body":"自動回収ONの袋を持っていると、拾った物が自動で袋に入っていく。"},{"id":"h018","unlockStage":4,"majorCategory":"はじめに","minorCategory":"大きな袋","title":"見た目と整理","body":"見た目は16種類から選べる。ソートボタンで中身を一発整理できる。"},{"id":"h019","unlockStage":4,"majorCategory":"はじめに","minorCategory":"大きな袋","title":"袋の注意","body":"袋はオフハンドに装備できない(紛失防止)。中身は袋ごとに世界へ保存される。"},{"id":"h111","unlockStage":4,"majorCategory":"はじめに","minorCategory":"モンスターポート(防衛用)","title":"防衛ポートの使い方","body":"防衛用のポートを置き、守らせたいペットを収容する。⏎収容したペットが、拠点から20マス以内に入ってきた敵を迎撃してくれる。⏎バニラのゾンビやスケルトンも対象になる。"},{"id":"h112","unlockStage":4,"majorCategory":"はじめに","minorCategory":"モンスターポート(防衛用)","title":"迎撃の範囲","body":"GUIの『範囲ON』を押すと、迎撃範囲が赤い枠で見える。⏎敵を追いかけて離れすぎたときは、自動で拠点へ戻ってくる。⏎敵がいないときは拠点の周りを歩いて見張っている。"},{"id":"h112b","unlockStage":4,"majorCategory":"はじめに","minorCategory":"モンスターポート(防衛用)","title":"狙う敵の強さ","body":"GUIの『ターゲット：〜』を押すと、狙う相手を 弱い→同等→強い→全て の順に切り替えられる。⏎強さはレベルとHP・MP・攻撃・守備・魔守・素早さを合わせた総合力で比べる。相手が自分の総合力の0.9〜1.1倍なら『同等』、それ未満は『弱い』、超えると『強い』。⏎強さの比較はペット全体の合計ではなく、収容ペット1体ずつ敵1体と個別に行う。預けた全員に同じ設定が入る。⏎強い相手を無視させれば、2軍のペットを安全に育てられる。"},{"id":"h113","unlockStage":4,"majorCategory":"はじめに","minorCategory":"モンスターポート(防衛用)","title":"仲間にならない","body":"防衛ポートのペットが倒した相手は仲間にならない。⏎拠点に置きっぱなしでもペット収納ベルが溢れないようにするため。⏎経験値はペットに入る(ゴールドは入らない)。"},{"id":"h114","unlockStage":4,"majorCategory":"はじめに","minorCategory":"モンスターポート(防衛用)","title":"GUIの見かた","body":"右上は『攻撃力合計』、行の状態は『警備中』と出る。⏎『警備を停止』を押すと迎撃をやめて休ませられる。"},{"id":"h115","unlockStage":4,"majorCategory":"はじめに","minorCategory":"モンスターポート(防衛用)","title":"作り方","body":"丸石7個で作れる。⏎マイクラのクラフトと、鍛冶(アイテム/その他・Lv1)の両方に登録されている。"},{"id":"h130","unlockStage":4,"majorCategory":"はじめに","minorCategory":"コロシアム","title":"コロシアムとは","body":"『コロシアムの受付』を開けた場所に置き、右クリックで挑む級を選ぶ。⏎ペットだけで戦う勝ち抜き戦で、勝つと賞金がもらえる。"},{"id":"h131","unlockStage":4,"majorCategory":"はじめに","minorCategory":"コロシアム","title":"出場するペット","body":"受付から16マス以内にいる、追従中か攻撃中の自分のペットが全員出場する。⏎気絶しているペットと、ポートで働いているペットは出場しない。"},{"id":"h132","unlockStage":4,"majorCategory":"はじめに","minorCategory":"コロシアム","title":"試合のルール","body":"相手は3体。戦うのはペットだけで、プレイヤーは手出しできない(攻撃してもダメージ0)。⏎相手を全部倒せば勝ち。戦えるペットがいなくなると負け。⏎5分たっても決着しなければ引き分けで終わる。"},{"id":"h133","unlockStage":4,"majorCategory":"はじめに","minorCategory":"コロシアム","title":"級とレベル","body":"Lv3の『スライム級』からLv99の『魔獣イギュア級』まで33段階。⏎相手のレベルは1級ごとに3ずつ上がる。⏎1つ勝つと次の級が解放される。参加費と賞金も級ごとに上がっていく。"},{"id":"h134","unlockStage":4,"majorCategory":"はじめに","minorCategory":"コロシアム","title":"負けても大丈夫","body":"負けたときは、その試合に出場したペットが全員その場で復活する。⏎出場していないペットは復活しないので、気絶したままなら神父かザオ系で起こそう。⏎コロシアム中に気絶したペットはペット収納ベルへ自動収納されず、会場に倒れたまま残る。"},{"id":"h135","unlockStage":4,"majorCategory":"はじめに","minorCategory":"コロシアム","title":"もらえないもの","body":"相手を倒しても経験値・ゴールド・ドロップ・仲間化は無い。⏎報酬は勝ったときの賞金だけ。"},{"id":"h136","unlockStage":4,"majorCategory":"はじめに","minorCategory":"コロシアム","title":"作り方","body":"丸石8個で作れる。⏎導きの書では、大きな袋と同じ段階(農業ポートで種がまかれたとき)にもらえる。"},{"id":"h020","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"HP(体力)","body":"0になると倒れてしまう。回復はやくそう・ホイミ系・DQMベッド・レベルアップなどで。装備やアクセサリで最大HPも伸びる。"},{"id":"h021","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"MP(魔力の源)","body":"呪文や特技を使うのに必要。魔法の実や宿で回復できる。装備・アクセサリで最大MPが増える。"},{"id":"h022","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"攻撃力","body":"通常攻撃・特技の威力に直結する。武器と職業レベル、力の種で伸ばせる。"},{"id":"h023","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"守備力","body":"受ける物理ダメージは「相手の攻撃力−自分の守備力」。守備を固めるとダメージが目に見えて減る。"},{"id":"h024","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"魔力","body":"攻撃呪文の威力に上乗せされる(威力+魔力×0.5)。魔法使い系の生命線。"},{"id":"h025","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"魔法守備","body":"受ける魔法ダメージを減らす。魔法を使う敵にはこちらを固めよう。"},{"id":"h026","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"レベルと経験値","body":"モンスターを倒すとDQM経験値が入り、レベルが上がる。レベルアップでステータスが伸び、設定によってはHP・MPが全回復する。"},{"id":"h027","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"ステータス","title":"ゴールド","body":"冒険の血液。討伐・出荷・鍛冶・売却などで稼ぎ、装備や素材に使う。"},{"id":"h028","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"戦闘のきほん","title":"ダメージの仕組み","body":"物理は「攻撃力−守備力」(最低1)。魔法は「威力+魔力×0.5−魔法守備」。表示ダメージそのままが通る分かりやすい計算式。"},{"id":"h029","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"戦闘のきほん","title":"ためる","body":"「ためる」で力を溜めると、次の一撃が大きく伸びる。強敵への初撃に。"},{"id":"h030","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"戦闘のきほん","title":"補助呪文のすすめ","body":"マホトーンで呪文封じ、ヘナトスで攻撃力ダウン。強敵ほど補助が効く。"},{"id":"h031","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"戦闘のきほん","title":"仲間と戦う","body":"ペットの指示・フォーメーション・種バフを組み合わせるのが勝ち筋。1人で抱え込まない。"},{"id":"h032","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"戦闘のきほん","title":"逃げるが勝ち","body":"勝てない相手からは離れよう。負けても鍛え直してまた挑めばいい。"},{"id":"h033","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"死亡とリスポーン","title":"死んでしまったら","body":"リスポーン地点で復活する。ペットも一緒にリスポーン地点へ戻ってくる。"},{"id":"h034","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"死亡とリスポーン","title":"装備を落とさない設定","body":"「死んだときに装備を落とさない」設定がONなら、ホットバー・防具・オフハンドは保管され復活時に返却される。万一返却されずに終了しても、次のログインで自動返却される。"},{"id":"h035","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"死亡とリスポーン","title":"アクセサリーは安全","body":"DQMアクセサリー欄の装備は死亡でロストしない。"},{"id":"h036","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"宝箱の色","body":"宝箱は赤→黒→青→緑→紫→金の順に豪華になる。良い色を見つけたら開けずにはいられない。"},{"id":"h037","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"夜の過ごし方","body":"夜は魔物が元気になる時間。自信がないうちは明かりのそばで過ごし、ベッドで朝にしよう。"},{"id":"h038","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"騎乗の証","body":"騎乗の証があれば大きな仲間の背に乗って旅ができる。海や空を行ける仲間なら行動範囲が一気に広がる。"},{"id":"h039","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"土地とモンスター","body":"土地(バイオーム)が変われば出会うモンスターも、作れる装備のレシピも変わる。遠出は最高の投資。"},{"id":"h040","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"メタル系はチャンス","body":"メタル系のモンスターは倒せばたっぷり経験値をくれる。見つけたら総攻撃だ。"},{"id":"h041","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"Bキー: ペットクリック判定","body":"Bキーでペットのクリック判定をON/OFFできる。建築の邪魔になるときはOFFに。Shift+Bでペット判別表示も切り替え。"},{"id":"h042","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"特技はShift+左クリック","body":"選択中の特技はShift+左クリックで即発動。長押しは不要。"},{"id":"h043","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"回復ターゲットのHP表示","body":"回復呪文のターゲットを合わせると、相手の残りHPが数字で見える。"},{"id":"h044","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"魔法・特技ホットバー","body":"魔法・特技ホットバーは職業ごとに記憶される。転職しても並びが戻る。"},{"id":"h045","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"仲間にする","title":"契約のしかた","body":"野生のモンスターに近づいて右クリックすれば契約できる。気絶して倒れている子も契約できる(契約後にザオ系かせかいじゅの葉で起こそう)。"},{"id":"h046","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"仲間にする","title":"連れ歩ける数","body":"一緒に連れ歩ける(ついてこいで追従できる)のは10匹まで。超えたぶんは指令のとき強制的に待機になる。待機も含めて世界に出せるのは20匹で、あふれた仲間は『ペット収納ベル』が預かってくれる。"},{"id":"h047","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"仲間にする","title":"ペット収納ベル","body":"しゃがみ+右クリックで収納、ベル使用でいつでも呼び出し。気絶中の子も収納できる。"},{"id":"h048","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"指示と作戦","title":"ペットへの指示","body":"待機・ついてこい・攻撃などのモードを切り替えられる。作業中は待機、探索はついてこいが基本。"},{"id":"h049","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"指示と作戦","title":"グループさくせん","body":"全ペットまとめて作戦を変えられる。「ガンガンいこうぜ」「いのちだいじに」で立ち回りが変わる。"},{"id":"h050","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"指示と作戦","title":"性格","body":"仲間it性格があり、戦い方や退き際に個性が出る。"},{"id":"h051","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"フォーメーション","title":"フォーメーションとは","body":"隊列を組むとペットとプレイヤー両方にバフがかかる。人数が揃うほど強力な陣形が選べる。"},{"id":"h052","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"フォーメーション","title":"F3〜F6の陣形","body":"F3: 攻撃1.1倍 / F4: 守備1.1倍 / F5: 攻守1.05倍 / F6: 守備・魔守1.1倍。(実際の効果はフォーメーション画面で確認)"},{"id":"h053","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"フォーメーション","title":"F7〜F10の陣形","body":"F7: 攻撃・魔力1.1倍 / F8〜F10はさらに強力な複合バフ。大人数の陣形はボス戦の切り札。"},{"id":"h054","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"種族シナジー","title":"種族シナジーとは","body":"同じ種族の仲間を並べると1体あたり+2%のボーナス(2〜10体)。自然=最大HP↑ / 魔獣=攻撃↑ / 物質=守備↑。"},{"id":"h055","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"ペットのレベル","body":"一緒に戦えば経験値が入りレベルアップ。ステータスの伸びは個体ごとに違う。"},{"id":"h056","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"呪文・特技の習得","body":"レベルが上がると新しい呪文を覚えることがある。覚える内容は図鑑でも確認できる。"},{"id":"h057","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"ペット装備","body":"ペットにも武器・盾・防具を持たせられる。働き者には作業Lvも育つ。"},{"id":"h058","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"経験の聖典・性格の書","body":"カジノ景品。経験の聖典はレベル+1、性格の書は性格をランダムに変える。"},{"id":"h059","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"配合","title":"配合のきほん","body":"配合の杖を使うと、Lv20以上の2匹の仲間から新しい仲間が生まれる。親の力を受け継いで最初から強い。⏎配合の神官なら、Minecraft Lv10以上で収納ベル内の2匹をペットLv不問で選べる。Minecraft Lv10は配合・転生が成功した後に消費する。"},{"id":"h060","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"配合","title":"配合ランク","body":"配合を重ねるほど高ランクのモンスターに手が届く。"},{"id":"h061","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"配合","title":"転生","body":"転生の杖でLv20以上の2匹の仲間を使い、親Aの見た目のまま生まれ変わらせることができる。"},{"id":"h062","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"配合","title":"血統と＋1","body":"名前の「＋数字」は配合・転生を重ねた世代数。子は両親のうち大きい数字＋1になる。⏎＋1ごとに装備・種バフを除いた基準能力の約10%ずつ継承が強くなり、＋10で約2倍。現在は上限なし。⏎生まれた子は親の血統も引き継ぐ。お気に入りの家系図を作るのも一興。"},{"id":"h063","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"作成のきほん","title":"レシピとランク","body":"レシピには土地ごとのランクがある。遠い土地へ行くほど新しいレシピが解放される。"},{"id":"h064","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"作成のきほん","title":"素材集め","body":"素材は手持ちと周りのチェストから自動で集まる。足りない素材はメッセージで教えてくれる。"},{"id":"h065","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"作成のきほん","title":"一度作れば店に並ぶ","body":"自分で作ったことのある装備は、武器屋・防具屋でも買えるようになる。"},{"id":"h066","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"目押し","title":"目押しのきほん","body":"作成時のミニゲーム。バーが往復するので、緑ゾーンでクリック。5回の成否で品質が決まる。"},{"id":"h067","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"目押し","title":"芯(中心)を狙え","body":"ゾーン中央の濃い部分=芯に当てると1段上の品質を狙える。5回全部芯なら伝説確定！"},{"id":"h068","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"目押し","title":"ふいご・見切り・手直し","body":"左のボタンで補助が使える。ふいご=ゾーン拡大 / 見切り=減速 / 手直し=1回やり直し。"},{"id":"h069","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"目押し","title":"追い打ちと仕上げ","body":"最後に追い打ち(成功+1段/失敗-1段)か、そのまま仕上げるかを選べる。攻めるか守るかはあなた次第。"},{"id":"h070","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"品質","title":"品質は5段階","body":"粗悪(-20%)/通常/良質(+10%)/名品(+20%)/伝説(+30%)。名前に色付きの接頭語が付く。"},{"id":"h071","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"品質","title":"伝説の品","body":"名品からまれに昇格する最高品質。仕上げ担当の熟練と芯の数で確率が上がる。"},{"id":"h072","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"強化と分解","title":"打ち直し(+強化)","body":"できた装備は打ち直しで+1〜+9まで強化できる。後半は成功率が下がるが、性能の伸びは大きい。"},{"id":"h073","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"強化と分解","title":"分解","body":"いらない装備は分解すると素材が戻ってくることがある(50%、粗悪は25%)。"},{"id":"h074","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"担当と熟練","title":"工程担当","body":"火入れ/鍛打/仕上げの担当を決めると、それぞれ固有の補助効果が出る。"},{"id":"h075","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"担当と熟練","title":"熟練Lv","body":"担当工程をこなすと熟練が上がり(最大Lv10)、補助効果の発生率が伸びる。"},{"id":"h076","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"担当と熟練","title":"鍛冶の秘伝書","body":"鍛冶依頼の報酬でまれにもらえる。使うと担当工程の熟練が1レベル上がる。"},{"id":"h077","unlockStage":4,"majorCategory":"鍛冶","minorCategory":"依頼","title":"鍛冶依頼","body":"武器屋・修理屋にしゃがみ右クリックで依頼を受けられる。1日3件、報酬は売値の2倍。"},{"id":"h078","unlockStage":4,"majorCategory":"農業","minorCategory":"栽培のきほん","title":"畑はペットに任せる","body":"耕し・水やり・種まき・収穫まで全部ペットがやってくれる。種はポートかチェストへ。"},{"id":"h079","unlockStage":4,"majorCategory":"農業","minorCategory":"栽培のきほん","title":"種の品質は3段階","body":"無印→超→極。上の品質ほど食べたときの効果が大きい。"},{"id":"h080","unlockStage":4,"majorCategory":"農業","minorCategory":"栽培のきほん","title":"肥料","body":"肥料で品質アップ、超肥料は大成功率も上がる。極肥料は鍛冶で作れる。"},{"id":"h081","unlockStage":4,"majorCategory":"農業","minorCategory":"収穫のコツ","title":"大成功","body":"収穫時に確率で大成功。無印作物は超品質になり、超以上は収穫量+1。収穫担当の農業Lvと自然系ペットで確率アップ。"},{"id":"h082","unlockStage":4,"majorCategory":"農業","minorCategory":"収穫のコツ","title":"大当たり","body":"大成功時、さらに低確率で1段上の品質の苗を掘り当てる。上位の苗の主な入手ルート。"},{"id":"h083","unlockStage":4,"majorCategory":"農業","minorCategory":"収穫のコツ","title":"豊作の日","body":"担当全員が農業Lv80以上だと、まれに「豊作の日」が来る。その日は実の品質が1段アップ。"},{"id":"h084","unlockStage":4,"majorCategory":"農業","minorCategory":"一斉収穫フィーバー","title":"フィーバーのやり方","body":"畑に実りが溜まるとポートGUIに「一斉収穫」ボタンが出る。目押しで成功すると収穫2倍、芯なら品質もアップ。"},{"id":"h085","unlockStage":4,"majorCategory":"農業","minorCategory":"一斉収穫フィーバー","title":"実りを溜める","body":"「実りを溜める」をONにすると収穫担当が収穫を止めて実を溜めてくれる。フィーバー前の仕込みに。"},{"id":"h086","unlockStage":4,"majorCategory":"農業","minorCategory":"交配と依頼","title":"交配種","body":"違う系統の作物を隣どうしで育てると、まれに交配種(剛力の種・叡智の種)が採れる。2系統のバフが同時に付く貴重品。"},{"id":"h087","unlockStage":4,"majorCategory":"農業","minorCategory":"交配と依頼","title":"出荷依頼","body":"道具屋にしゃがみ右クリックで出荷依頼。育てた作物がお金に変わる。報酬でまれに農業の秘伝書。"},{"id":"h088","unlockStage":4,"majorCategory":"農業","minorCategory":"交配と依頼","title":"農業の秘伝書","body":"使うと農業ポートの担当工程(種まき/水やり/収穫)の熟練が1レベル上がる。しゃがみ右クリックで対象工程を切り替え。"},{"id":"h089","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"拠点づくり","title":"ホーム","body":"最初の拠点。ベッドやチェストを置いて暮らしを整えよう。"},{"id":"h090","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"拠点づくり","title":"施設を増やす","body":"施設アイテムをポートに入れるとペットが建ててくれる。武器屋・防具屋・道具屋・教会・カジノ・・増えるほど便利に。"},{"id":"h091","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"拠点づくり","title":"第二の拠点","body":"お気に入りの土地を見つけたら、拠点をもう1つ構えるのもいい。"},{"id":"h092","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"お店","title":"武器屋・防具屋","body":"自分で作ったことのある装備が並ぶ。品ぞろえは腕前次第。"},{"id":"h093","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"お店","title":"道具屋","body":"回復アイテムや種を売買できる。出荷依頼の受付もここ。"},{"id":"h094","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"お店","title":"教会","body":"回復や蘇生をしてもらえる。困ったときの神頼み。"},{"id":"h095","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"お店","title":"カジノ","body":"コインを稼いで景品と交換。経験の聖典・性格の書などの珍しい品も。勝負はほどほどに。"},{"id":"h096","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"マジックツールダンジョン","title":"ダンジョンに挑む","body":"マジックツールを使うとダンジョンへ挑戦できる。奥ほど良い宝が眠る。"},{"id":"h097","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"マジックツールダンジョン","title":"明かりでわかせない","body":"ダンジョンや洞窟では、明かりを置いた周りに魔物が湧かなくなる。松明10本で光20チャージ。れんごくの羽などの光アイテムでも補充できる(1個で光20)。"},{"id":"h098","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ボス","title":"祭壇のボス","body":"各地の祭壇では強大なボスが待つ。装備・種バフ・フォーメーションの3点を確認して挑もう。"},{"id":"h099","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"ボス","title":"討伐の証","body":"強敵の討伐の証は、さらに強い装備の素材になる。"},{"id":"j_0","unlockStage":4,"majorCategory":"職業","minorCategory":"職業一覧","title":"遊び人","body":"ステータス: HP C / MP D / 攻撃 C / 守備 D / 魔力 C / 魔法守備 D⏎得意武器: ムチ(S)、ブーメラン(SS)⏎全武器ランク: バニラ剣B / 剣D / 勇者の剣E / 槍D / 短剣B / 杖E / 棍B / 爪B / 拳E / ハンマーD / 斧D / ムチS / 弓D / ブーメランSS⏎ダーマ神殿で転職できる。ランクが高い武器ほどダメージ倍率が伸びる。"},{"id":"j_1","unlockStage":4,"majorCategory":"職業","minorCategory":"職業一覧","title":"戦士","body":"ステータス: HP S / MP E / 攻撃 S / 守備 S / 魔力 E / 魔法守備 E⏎得意武器: 槍(S)、斧(SSS)⏎全武器ランク: バニラ剣B / 剣A / 勇者の剣B / 槍S / 短剣B / 杖E / 棍B / 爪A / 拳B / ハンマーA / 斧SSS inorCategory":"種・作物","title":"種の品質と育て方","body":"どの種・実も畑で育てて増やせる。品質は無印→超→極の3段階(黄金のみ真・極まで4段階)で、上の品質ほど効果が大きい。"},{"id":"q001","unlockStage":4,"majorCategory":"クエスト","minorCategory":"メインクエスト","title":"メインクエストの始め方","body":"マスタードラゴンに話しかけると受注できる。受けるとクエスト欄の最上部に「魔王の証を集めよう(0／10個)」と表示される。"},{"id":"q002","unlockStage":4,"majorCategory":"クエスト","minorCategory":"メインクエスト","title":"魔王の証","body":"各地の祭壇のボスを倒すと手に入る。集めた数はクエスト欄でいつでも確認できる。"},{"id":"q003","unlockStage":4,"majorCategory":"クエスト","minorCategory":"メインクエスト","title":"魔王の間","body":"魔王の証を10個集めると挑めるようになる。行く前に装備・種バフ・仲間の準備を整えよう。"},{"id":"q004","unlockStage":4,"majorCategory":"クエスト","minorCategory":"メインクエスト","title":"六魔王","body":"魔王たちを打ち倒した者には、ボス級モンスターの配合が解禁される・・。"},{"id":"q005","unlockStage":4,"majorCategory":"クエスト","minorCategory":"町の人のおねがい","title":"おねがいの受け方","body":"町の人のおよそ5人に1人が「おねがい」を持っている。話しかけると事情と一緒に頼まれごとを聞ける。"},{"id":"q006","unlockStage":4,"majorCategory":"クエスト","minorCategory":"町の人のおねがい","title":"おねがいの種類","body":"討伐(モンスター退治)・届け物・探し物・言伝(ことづて)の4種類。内容はその人ごとに決まっている。"},{"id":"q007","unlockStage":4,"majorCategory":"クエスト","minorCategory":"町の人のおねがい","title":"報告と報酬","body":"達成したら「依頼した本人」に報告する(場所はクエスト欄に座標が出る)。報酬はちいさなメダル1枚。同じ人のおねがいは一度きり。"},{"id":"q008","unlockStage":4,"majorCategory":"クエスト","minorCategory":"町の人のおねがい","title":"クエスト欄","body":"受注中のおねがいは画面のクエスト欄に直近5件まで表示される。6件目以降も記録されていて、完了すると繰り上がる。"},{"id":"q009","unlockStage":4,"majorCategory":"クエスト","minorCategory":"町の人のおねがい","title":"ちいさなメダル","body":"集めたメダルは「メダル王の城」を建てると交換所で景品に換えられる。"},{"id":"q010","unlockStage":4,"majorCategory":"クエスト","minorCategory":"お店の依頼","title":"鍛冶依頼","body":"武器屋・修理屋にしゃがみ右クリックで受注。1日3件、作ったことのある装備から出題され、報酬は売値の2倍。まれに鍛冶の秘伝書ももらえる。"},{"id":"q011","unlockStage":4,"majorCategory":"クエスト","minorCategory":"お店の依頼","title":"出荷依頼","body":"道具屋にしゃがみ右クリックで受注。育てたことのある作物から出題され、納品でゴールドに。まれに農業の秘伝書ももらえる。"},{"id":"f001","unlockStage":4,"majorCategory":"釣り","minorCategory":"釣りのはじめ方","title":"必要なもの","body":"釣り竿とルアーがいる。どちらも鍛冶で作れる。⏎竿を持って水辺で右クリックすると釣りが始まる。⏎ルアーは釣り画面の枠にセットする。64個まで入る。"},{"id":"f002","unlockStage":4,"majorCategory":"釣り","minorCategory":"釣りのはじめ方","title":"投げてから当たりまで","body":"ウキが沈んでいくあいだ待つ。⏎水中に光る「当たり」が出たら左クリックでアワセる。⏎早すぎても遅すぎても逃げられる。ニセの当たり(フェイント)も混じる。"},{"id":"f003","unlockStage":4,"majorCategory":"釣り","minorCategory":"釣りのはじめ方","title":"ルアーの役割","body":"ルアーごとに攻撃力と、かかりやすい相手(小魚/大物/モンスター)が違う。⏎狙いたい相手に合ったルアーを使う。⏎使うたびに一定確率で壊れる。壊れたら次の1個が自動でセットされる。"},{"id":"f004","unlockStage":4,"majorCategory":"釣り","minorCategory":"取り込み","title":"目押しバー","body":"かかったら左クリックでバーの当たり枠に合わせる。⏎真ん中の「芯」で決めると大きく削れる。⏎3回失敗すると逃げられる。上位の竿ほどバーが遅くなって狙いやすい。"},{"id":"f005","unlockStage":4,"majorCategory":"釣り","minorCategory":"取り込み","title":"糸の張り","body":"体力バーの下が糸の張り。振り切ると糸が切れて逃げられる。⏎8割から赤くなる。逆に3秒たるませ続けても外れる。⏎何もしなければ少しずつ緩む。「削る」と「休める」の判断が要る。"},{"id":"f006","unlockStage":4,"majorCategory":"釣り","minorCategory":"取り込み","title":"リールを巻く","body":"スペース長押しで巻く。体力を削って魚を寄せられる。⏎そのかわり糸の張りが増え続けるので、巻きっぱなしは切れる。"},{"id":"f007","unlockStage":4,"majorCategory":"釣り","minorCategory":"取り込み","title":"連打","body":"魚が暴れたときに稀に発生する。⏎制限時間内に左クリックを規定回数押し切る。残り秒数が画面に出る。⏎押し切れないと逃げられる。押すたびに体力が1ずつ削れる。"},{"id":"f008","unlockStage":4,"majorCategory":"釣り","minorCategory":"魚のクセ","title":"逃げる・暴れる・潜る","body":"住んでいる場所と大きさで動きが変わる。⏎逃げる(小魚)=たまに走り出してバーが2倍速。⏎暴れる(大物)=当たり枠が速く動き、そのあいだ芯が消える。⏎潜る(深海)=放っておくと底まで潜られて糸が切れる。目押しを当てると引き戻せる。"},{"id":"f009","unlockStage":4,"majorCategory":"釣り","minorCategory":"ヌシ","title":"ヌシとは","body":"バイオーム帯ごとに1種、計8種いる大物。⏎大物・モンスター狙いのルアーで、ランク4以上の場所に稀に出る。⏎体力が元の魚の3倍あり、削るたびに動きが変わる。"},{"id":"f010","unlockStage":4,"majorCategory":"釣り","minorCategory":"魚交換所","title":"魚をポイントに換える","body":"釣った魚を魚ポイントに換えて、道具や素材と交換できる施設。⏎金宝箱から手に入る施設アイテムを置くと建つ。⏎大きな袋の中の魚をまとめてポイントに換えるボタンもある。"},{"id":"f011","unlockStage":4,"majorCategory":"釣り","minorCategory":"魚図鑑","title":"記録","body":"釣った魚は魚図鑑に記録される。大きさの記録も残る。⏎ヌシは通常の魚のあとに並ぶ。"},{"id":"s001","unlockStage":4,"majorCategory":"アイテム","minorCategory":"特殊効果のある武具","title":"特殊効果とは","body":"一部の武器・防具・アクセサリには、攻撃力とは別の効果が付いている。⏎効果は鍛冶画面の「効果」欄と、アイテムの説明に出る。"},{"id":"s002","unlockStage":4,"majorCategory":"アイテム","minorCategory":"特殊効果のある武具","title":"効果の種類","body":"種族特効(ゾンビ・ドラゴン・悪魔・魔獣・メタルに2倍)⏎属性攻撃(炎・氷・風。相手の弱点と合えば2倍)⏎状態異常・即死・2回攻撃・会心率アップ⏎HP/MPの自動回復・耐性・解毒⏎採掘速度・水中速度・透明・暗視・経験値アップ"},{"id":"s003","unlockStage":4,"majorCategory":"アイテム","minorCategory":"特殊効果のある武具","title":"呪文が撃てる武具","body":"右クリックでギラ・ヒャダルコ・バギクロス・ライデインを撃てるものがある。⏎撃つと耐久が3減る。"},{"id":"s004","unlockStage":4,"majorCategory":"アイテム","minorCategory":"特殊効果のある武具","title":"セット効果","body":"「◯つセットで」と書かれた効果は、DQMの防具をその数だけ身につけていると発動する。⏎鍛冶画面には「(防具4点で発動)」のように条件も出る。"},{"id":"h120","unlockStage":4,"majorCategory":"はじめに","minorCategory":"大きな袋","title":"宝箱でも同じ収納","body":"大きな袋と同じ540枠の収納が、置ける宝箱としても作れる。⏎超大きい宝箱(赤・1枠64)→特大の宝箱(紫・1枠999)→無限の宝箱(金・1枠9999)の順に強くなる。⏎大きい宝箱9個から順に作っていく。"},{"id":"h121","unlockStage":4,"majorCategory":"はじめに","minorCategory":"大きな袋","title":"宝箱と袋のやりとり","body":"宝箱のGUIの右下に袋を置く枠がある。⏎ボタンで中身をまとめて出し入れできる。⏎「全部」以外のタブを開いていると、そのタブのアイテムだけが対象になる。"},{"id":"p001","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"働かせて育てる","body":"モンスターポートで働いているあいだ、ペットに経験値が入る。⏎防衛用は倒した相手の経験値が、そのポートのペット全員に入る。⏎ポートごとに1分あたりの上限があるので、頭数を増やしても伸びる速さは変わらない。"},{"id":"p002","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"育成","title":"ポートのペットが気絶したら","body":"働いているペットが倒されると気絶して、そのポートに残る。⏎気絶中は働かないし経験値も入らない。⏎ポートから呼び出して、せかいじゅの葉かザオ系で起こす。"},{"id":"h122","unlockStage":4,"majorCategory":"冒険のきほん","minorCategory":"移動と探索","title":"バイオームのランク","body":"画面のバイオーム名の横に「(ランク1)」と出る。⏎ランクはそのバイオームを何番目に見つけたかで決まる。⏎ランクが高い土地ほど強いモンスターと良い鉱石が出る。"},{"id":"c001","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"コロシアム","title":"コロシアムとは","body":"ペットだけで戦う勝ち抜き戦。石レンガ8個と金インゴット1個で「コロシアムの受付」を作って設置する。⏎右クリックで級を選んで挑戦。参加費を払い、勝てば賞金がもらえる。"},{"id":"c002","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"コロシアム","title":"試合のルール","body":"受付の近くにいる自分のペット(追従か攻撃指示)が全員入場する。⏎プレイヤーは手出しできない。攻撃してもダメージは入らない。⏎相手を倒しても経験値やドロップは無く、賞金だけが報酬。"},{"id":"c003","unlockStage":4,"majorCategory":"施設と暮らし","minorCategory":"コロシアム","title":"級と解放","body":"スライム級からはじまり、勝つと次の級が解放される。全8級。⏎上の級ほど相手が強く、参加費も賞金も大きい。⏎ペットが全員倒れると敗北。参加費は戻らない。"},{"id":"h137","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"ガンビットとは","body":"ペットの動きを自分でルールにして組む仕組み。⏎1枚のルールは『対象＋条件1＋条件2＋行動』の4つでできている。⏎上から順に見て、最初に当てはまった1枚だけを実行する。並べ替えがそのまま戦い方になる。"},{"id":"h138","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"使いはじめ方","body":"Zメニューの『ガンビット編集』を開く。近く24マスに自分のペットがいるときだけ組める。⏎画面右上の『さくせんをガンビットにする』を押すと、そのペットがルールで動くようになる。⏎もう一度押すと元のさくせんへ戻る。押した時点で待機だったペットは追従に起こす。"},{"id":"h139","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"組み方の手順","body":"右の4列(対象/条件1/条件2/行動)から1つ選び、左のルール欄をクリックして置く。⏎置いてあるガンビットは左クリックで持ち上げて別の場所へ移せる。右クリックで外して手元に戻る。⏎各行の右端にある▲▼で、そのルールの優先順位を入れ替えられる。"},{"id":"h140","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"ルールの枚数","body":"使える枚数はペットのレベルで増える。Lv1で3枚、Lv99で12枚。⏎枠を超えたぶんは保存されない。配合や転生で生まれた子は枠がLv1ぶんに戻るので、親のルールは引き継がず、組んであったガンビットは飼い主の手元へ返る。"},{"id":"h141","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"ガンビットは装備","body":"ガンビットはアイテム。1つのスロットに置くと1個消費し、外すと戻ってくる。⏎同じ種類を数だけ持っていれば、何匹にでも同じルールを組める。⏎大きな袋の中身も数に入る。"},{"id":"h142","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"対象の選び方","body":"『自分』はペット自身、『主』は飼い主のこと。⏎味方とペットは同じ飼い主の他のペット、パーティは同じパーティの人。⏎敵は種族・メタル系・魔王系・きらきら個体などで絞り込める。"},{"id":"h143","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"条件の噛み合わせ","body":"条件1には『条件2が要るもの』と『要らないもの』がある。⏎HP・MPには◯%以下、距離には◯マス以内、数には◯体以上、というように種類の合うものだけ組める。⏎噛み合っていない行には赤い×が出る。×にマウスを乗せると理由が読める。"},{"id":"h144","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"受け皿を置く","body":"どのルールにも当てはまらないと、ペットはその場から動かない。⏎一番下に『主／常に／追従』のような受け皿を1枚置いておくと、平時はついて歩くようになる。⏎例: HP50%以下なら追従 → 敵がいれば戦う → それ以外は主について歩く。"},{"id":"h145","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"待機で止まる","body":"ペットを『待機』にしている間、ガンビットは丸ごと止まる。休ませたいときは待機にすればよい。⏎攻撃・追従・迎撃のときはルールで動く。⏎ガンビット中は『対象の強さ』の絞り込みと、性格による逃げ腰を無視してルールを優先する。"},{"id":"h146","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"型とマイセット","body":"編集画面の下にある『型・マイセット』から、組んだ内容を名前を付けて30個まで保存できる。⏎保存した型は他のペットにも流し込める。『コピー』『貼り付け』で1匹ぶんだけ写すこともできる。⏎こちらで用意した型(アタッカー・ヒーラー・ほじょ・かべなど7種)も同じ場所から呼び出せる。"},{"id":"h147","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"働かせる","body":"対象に『木材・石材・土・砂・砂利・鉱石・育った作物』を選び、行動を『壊す』にすると採ってくる。⏎『ドロップアイテム』＋『回収して渡す』にすると、落ちている物を拾って飼い主へ渡す。⏎渡し先は自動回収ONの大きな袋→持ち物→足元の順。伐採役と回収役を並べると流れ作業になる。"},{"id":"h148","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"働かせるときの決まり","body":"掘る対象は、行けると分かった場所だけを狙う。埋まったブロックや届かない場所は選ばない。⏎土・砂・砂利・石材・作物は飼い主の高さ±1マスだけを見る。木材と鉱石は上下8マスまで見る。⏎ブロックを置けない場所(魔王の間など)では壊さない。"},{"id":"h149","unlockStage":4,"majorCategory":"ペットと配合","minorCategory":"ガンビット","title":"ガンビットの集め方","body":"宝箱から出る。色が良いほど出やすい(赤30%/黒40%/青50%/緑60%/紫70%/金80%)。⏎道具屋では『敵(全て)』『自分』『常に』『たたかう』『待機する』を各1000Gで売っている。⏎まずは店で最初の1枚を組み、足りないものを宝箱で集めるとよい。"},{"id":"h150","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"キーの一覧","body":"Z=DQMメニュー(職業・魔法・ペット・設定・図鑑の入口)。⏎J=ペット全体への指示／Shift+J=さくせん変更／9=そのペットのさくせん／8=つかう呪文／G=狙う相手の強さ。⏎0=ペットメニューでしゃがみながら押すと配合の貸し出し。B=ペットのクリック判定の切替。"},{"id":"h151","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"便利な操作","title":"呪文と特技の使い分け","body":"呪文はホットバーに登録して、その枠を持って左クリック長押しで詠唱する。⏎特技は対応する武器を持って『Shift+左クリック』。呪文のように登録しても発動しない。⏎どちらも使えないときは、職業・レベル・武器の種類・MPのどれかが足りていない。"},{"id":"h153","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"困ったときは","title":"ペットが言うことを聞かない","body":"まず『さくせん』を見る。かいふくにまわれ・みをまもれ・めいれいさせろは自分から敵を探さない。⏎『待機』にしていると、その場から動かず、ガンビットも止まる。⏎Gキーの『狙う相手の強さ』が弱い相手だけになっていると、格上を無視し続ける。"},{"id":"h154","unlockStage":1,"majorCategory":"冒険のきほん","minorCategory":"困ったときは","title":"ペットが見当たらない","body":"50マス以上離れると、自動回収ONのペット収納ベルへ入る。ベルを開けば戻せる。⏎世界に出せるのは20匹まで。超えたぶんは自動でベルへ入る。⏎倒れたペットはその場に残る。ザオ系かせかいじゅの葉で起こす。"},{"id":"h155","unlockStage":2,"majorCategory":"冒険のきほん","minorCategory":"困ったときは","title":"作れるものが増えない","body":"鍛冶で作れる品は、その土地のバイオームランク以下のものだけ。⏎ランクは自分がそのバイオームを何番目に見つけたかで決まる。同じ場所でも人によって違う。⏎強い品を作りたいなら、まだ見ていないバイオームを開拓してから、そこで鍛冶をする。"},{"id":"h156","unlockStage":2,"majorCategory":"冒険のきほん","minorCategory":"困ったときは","title":"呪文をおぼえない","body":"呪文は職業とレベルで決まる。転職すると使えるのは今の職業(とサブ職業)のぶんだけ。⏎サブ職業ぶんは『サブで育てたレベル』と『メインのレベルの半分』の低いほうまで。⏎ホットバーに登録していない呪文は使えない。Zメニューの魔法ホットバー編集で入れておく。"},{"id":"h157","unlockStage":2,"majorCategory":"冒険のきほん","minorCategory":"困ったときは","title":"ダメージが通らない","body":"メタル系には普通の攻撃がほとんど通らない。呪文と多くの特技も効かない。⏎効くのはメタル系の武器・特技(最大2ダメージ)、どくばり(確実に1)、即死の武器、会心の一撃。⏎守備の高い相手には、攻撃力を上げるか、バイキルトなどで補うとよい。"},{"id":"h158","unlockStage":2,"majorCategory":"冒険のきほん","minorCategory":"困ったときは","title":"持ち物がすぐ一杯になる","body":"大きな袋を持つと、周りに落ちた物を自動で吸い込む。⏎何でも入って困るときは、袋の画面のレ点ボタンで種類を選ぶ。『全部』を外して必要な種類だけ入れられる。⏎袋には『名』ボタンで名前が付けられる。素材用・建材用と分けて持つと探しやすい。"},{"id":"h159","unlockStage":1,"majorCategory":"施設と暮らし","minorCategory":"遊び場","title":"どんな遊びがあるか","body":"カジノ(トランプ・スロット・ブロックくずし)、モンスター格闘場(賭けて観戦)、コロシアム(ペットの勝ち抜き)。⏎すごろく場(券を使って進む双六。仲間と順番に遊べる)、釣り場、魚交換所。⏎どれも町や拠点に建てられる。施設はバイオームランクが上がるほど良いものが建つ。"},{"id":"h160","unlockStage":2,"majorCategory":"施設と暮らし","minorCategory":"遊び場","title":"すごろく場","body":"すごろく券を1枚使って参加する。マスの効果でアイテム・ゴールド・戦闘が起きる。⏎パーティを組んでいれば全員に知らせが飛び、同じスタートを踏んだ人と順番に遊べる。⏎会場のランクが高いほど、もらえる品と出る敵が強くなる。ESCでいつでも切り上げられる。"},{"id":"h161","unlockStage":2,"majorCategory":"アイテム","minorCategory":"道具","title":"肉と捕獲","body":"肉を投げて食べさせ、食べている間に倒すと仲間になりやすい。⏎くんせいにく4%、ほねつきにく8%、しもふりにく16%。鍛冶で作れる(肉系＋素材)。⏎転生系と魔王系、ボスオーラ付きは肉を食べない。それ以外はメタル系も食べる。"},{"id":"h162","unlockStage":2,"majorCategory":"アイテム","minorCategory":"道具","title":"ペット収納ベル","body":"ペットをしまって持ち運ぶ道具。Shift+右クリックでしまう。⏎自動収納をONにしておくと、離れすぎたペットや、上限を超えたぶんが自動で入る。⏎中のペットは倒れたままでも入る。教会で治すか、出してからザオ系で起こす。"},{"id":"h163","unlockStage":3,"majorCategory":"アイテム","minorCategory":"道具","title":"旅の扉とルーラ","body":"ルーラは覚えた場所へ飛ぶ呪文。Shift+左クリック長押しでその場を記憶し、左クリック長押しで行き先を選ぶ。⏎リレミトは地下から地上へ脱出する。DQM設定で仲間も一緒に飛ぶようにできる。⏎旅の扉を置けば、決まった2点を行き来できる。"}],"generatedAt":"2026/08/31 09:19:33"}</script>
  <script>
  (function () {
    var data = JSON.parse(document.getElementById('page-data').textContent);
    var rows = data.rows;
    document.getElementById('updated').textContent = '最終更新: ' + data.generatedAt;
    
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
    function expandHashDetails() {
      if (!location.hash) return;
      var target = document.querySelector(location.hash);
      if (target && target.tagName === 'DETAILS') {
        target.open = true;
        target.scrollIntoView();
      }
    }

    function formatBody(body) {
      return escapeHtml(body).split('⏎').join('<br>');
    }

    function render() {
      var query = document.getElementById('searchInput').value.trim().toLowerCase();
      var filtered = rows.filter(function (r) {
        return !query || r.title.toLowerCase().indexOf(query) !== -1 || r.body.toLowerCase().indexOf(query) !== -1;
      });

      var majors = [];
      var byMajor = {};
      filtered.forEach(function (r) {
        if (!byMajor[r.majorCategory]) { byMajor[r.majorCategory] = { minors: [], byMinor: {} }; majors.push(r.majorCategory); }
        var g = byMajor[r.majorCategory];
        if (!g.byMinor[r.minorCategory]) { g.byMinor[r.minorCategory] = []; g.minors.push(r.minorCategory); }
        g.byMinor[r.minorCategory].push(r);
      });

      var html = majors.map(function (major) {
        var g = byMajor[major];
        var minorsHtml = g.minors.map(function (minor) {
          var itemsHtml = g.byMinor[minor].map(function (r) {
            return '<details class="entry" id="guide-' + escapeHtml(r.id) + '"><summary>' + escapeHtml(r.title) + '</summary>' +
              '<div class="entry-stats">' + formatBody(r.body) + '</div></details>';
          }).join('');
          return '<h3>' + escapeHtml(minor) + '</h3>' + itemsHtml;
        }).join('');
        return '<div class="guide-section"><h2>' + escapeHtml(major) + '</h2>' + minorsHtml + '</div>';
      }).join('');
      document.getElementById('content').innerHTML = html || '<div class="empty">該当する項目がありません</div>';
    }

    document.getElementById('searchInput').addEventListener('input', render);
    render();

    expandHashDetails();
  })();
  </script>
