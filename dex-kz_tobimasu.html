  <script>
  (function () {
    var data = JSON.parse(document.getElementById('dex-data').textContent);
    var monsters = data.monsters;
    document.getElementById('updated').textContent =
      '最終更新: ' + data.generatedAt + '(1時間毎に自動更新)';

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    function render() {
      var query = document.getElementById('searchInput').value.trim().toLowerCase();
      var html = monsters.map(function (m) {
        if (!m.tamed) {
          if (query) return '';
          return '<div class="entry hidden-entry">#' + (m.dexOrder + 1) + ' ???</div>';
        }
        if (query) {
          var spellsText = (m.spells || []).map(function (s) { return s.name; }).join('、').toLowerCase();
          var hit = m.nameJa.toLowerCase().indexOf(query) !== -1 || spellsText.indexOf(query) !== -1;
          if (!hit) return '';
        }
        var spellsHtml = (m.spells && m.spells.length)
          ? m.spells.map(function (s) { return 'Lv' + s.level + ' ' + escapeHtml(s.name); }).join('、')
          : '(なし)';
        return '<details class="entry"><summary>#' + (m.dexOrder + 1) + ' <strong>' + escapeHtml(m.nameJa) +
          '</strong><span class="badge">ランク' + escapeHtml(m.rankLabel || '-') + '</span></summary>' +
          '<div class="stats">HP:' + (m.hp != null ? m.hp : '-') + ' MP:' + (m.mp != null ? m.mp : '-') +
          ' 攻撃:' + (m.attack != null ? m.attack : '-') + ' 守備:' + (m.defense != null ? m.defense : '-') +
          ' 魔力:' + (m.magicPower != null ? m.magicPower : '-') + ' 魔守備:' + (m.magicDefense != null ? m.magicDefense : '-') +
          '<br>種族:' + escapeHtml(m.species || '-') + ' 弱点:' + escapeHtml(m.weakness || '-') + ' 出現時間帯:' + escapeHtml(m.dayTime || '-') +
          '<br>覚える呪文: ' + spellsHtml + '</div></details>';
      }).join('');
      document.getElementById('content').innerHTML = html || '<div class="empty">該当するモンスターがいません</div>';
    }

    document.getElementById('searchInput').addEventListener('input', render);
    render();
  })();
