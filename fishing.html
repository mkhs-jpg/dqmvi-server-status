  <script>
  (function () {
    var data = JSON.parse(document.getElementById('page-data').textContent);
    var fishItems = data.fishItems;
    document.getElementById('updated').textContent = '最終更新: ' + data.generatedAt;

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    function render() {
      var query = document.getElementById('searchInput').value.trim().toLowerCase();
      var rows = fishItems.filter(function (f) {
        return !query || f.name.toLowerCase().indexOf(query) !== -1 || (f.category || '').toLowerCase().indexOf(query) !== -1;
      }).slice().sort(function (a, b) { return a.points - b.points; }).map(function (f) {
        return '<tr><td>' + escapeHtml(f.name) + '</td><td>' + escapeHtml(f.category) + '</td><td>' + f.points + 'pt</td></tr>';
      }).join('');
      document.getElementById('content').innerHTML =
        '<table><thead><tr><th>名前</th><th>分類</th><th>必要ポイント</th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="3" class="empty">該当する交換品がありません</td></tr>') + '</tbody></table>';
    }

    document.getElementById('searchInput').addEventListener('input', render);
    render();
  })();
  </script>
