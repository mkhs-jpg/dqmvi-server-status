  <script>
  (function () {
    var data = JSON.parse(document.getElementById('players-data').textContent);
    var players = data.players;
    document.getElementById('updated').textContent =
      '最終更新: ' + data.generatedAt + '(1時間毎に自動更新、ダッシュボードとは別の閲覧専用ページです)';

    var activeIndex = 0;
    var sortKey = null;
    var sortDir = 1;

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    function renderTabs() {
      var tabButtons = document.getElementById('tabButtons');
      tabButtons.innerHTML = players.map(function (p, i) {
        return '<button class="tab-btn' + (i === activeIndex ? ' active' : '') + '" data-index="' + i + '">' +
          escapeHtml(p.name) + '</button>';
      }).join('');
      Array.prototype.forEach.call(tabButtons.querySelectorAll('.tab-btn'), function (btn) {
        btn.addEventListener('click', function () {
          activeIndex = Number(btn.dataset.index);
          sortKey = null;
          document.getElementById('searchInput').value = '';
          renderTabs();
          renderContent();
        });
      });
    }

    var COLUMNS = [
      { key: 'name', label: '名前' },
      { key: 'rank', label: 'ランク' },
      { key: 'level', label: 'Lv' },
      { key: 'personality', label: '性格' },
      { key: 'skills', label: 'スキル' },
      { key: 'hp', label: 'HP' },
      { key: 'mp', label: 'MP' },
      { key: 'attack', label: '攻撃' },
      { key: 'defense', label: '防御' },
      { key: 'acquire', label: '入手' },
    ];

    function petSortValue(pet, key) {
      switch (key) {
        case 'name': return pet.customName || pet.nameJa || pet.variant || '';
        case 'rank': return pet.rank == null ? -Infinity : pet.rank;
        case 'level': return pet.level == null ? -Infinity : pet.level;
        case 'personality': return pet.personality || '';
        case 'skills': return (pet.skills || []).length;
        case 'hp': return pet.hp == null ? -Infinity : pet.hp;
        case 'mp': return pet.mp == null ? -Infinity : pet.mp;
        case 'attack': return pet.attack == null ? -Infinity : pet.attack;
        case 'defense': return pet.defense == null ? -Infinity : pet.defense;
        // 入手順(図鑑順)が不明なモンスターは昇順で末尾に回るようInfinityにする
        case 'acquire': return pet.dexOrder == null ? Infinity : pet.dexOrder;
        default: return '';
      }
    }

    function renderContent() {
      var content = document.getElementById('content');
      var p = players[activeIndex];
      if (!p) { content.innerHTML = ''; return; }
      if (!p.hasData) {
        content.innerHTML = '<h2>' + escapeHtml(p.name) + '</h2><p class="empty">データなし(未ログインの可能性があります)</p>';
        return;
      }

      var allPets = p.pets || [];
      var query = document.getElementById('searchInput').value.trim().toLowerCase();
      var pets = allPets;
      if (query) {
        pets = allPets.filter(function (pet) {
          var name = (pet.customName || pet.nameJa || pet.variant || '').toLowerCase();
          var personality = (pet.personality || '').toLowerCase();
          var skills = (pet.skills || []).join('、').toLowerCase();
          return name.indexOf(query) !== -1 || personality.indexOf(query) !== -1 || skills.indexOf(query) !== -1;
        });
      }
      if (sortKey) {
        pets = pets.slice().sort(function (a, b) {
          var va = petSortValue(a, sortKey);
          var vb = petSortValue(b, sortKey);
          if (va < vb) return -1 * sortDir;
          if (va > vb) return 1 * sortDir;
          return 0;
        });
      }

      var realtimeBadge = p.realtime
        ? '<span class="badge good">オンライン(リアルタイム)</span>'
        : '<span class="badge">保存データ</span>';

      var headerHtml = COLUMNS.map(function (col) {
        // ソート中の列だけでなく全列に常時矢印を出し、クリックでソートできることを
        // 視覚的に分かるようにする(2026-08-27、矢印が無いと普通のテーブルに見えて
        // 「ソート機能が無い」と誤解されたため)。
        var arrow = sortKey === col.key
          ? (sortDir === 1 ? ' <span class="sort-arrow active">▲</span>' : ' <span class="sort-arrow active">▼</span>')
          : ' <span class="sort-arrow">⇅</span>';
        return '<th class="sortable" data-key="' + col.key + '">' + col.label + arrow + '</th>';
      }).join('');

      var rowsHtml = pets.map(function (pet) {
        var name = escapeHtml(pet.customName || pet.nameJa || pet.variant || '-');
        var rank = escapeHtml(pet.rankLabel || '-');
        var personality = escapeHtml(pet.personality || '-');
        var skills = escapeHtml((pet.skills && pet.skills.length) ? pet.skills.join('、') : '-');
        var hp = (pet.hp != null ? Math.round(pet.hp) : '-') + '/' + (pet.maxHp != null ? pet.maxHp : '-');
        var mp = (pet.mp != null ? Math.round(pet.mp) : '-') + '/' + (pet.maxMp != null ? pet.maxMp : '-');
        var acquire = pet.dexOrder != null ? ('#' + (pet.dexOrder + 1)) : '-';
        return '<tr><td>' + name + '</td><td>' + rank + '</td><td>' + (pet.level != null ? pet.level : '-') + '</td><td>' + personality +
          '</td><td>' + skills + '</td><td>' + hp + '</td><td>' + mp + '</td><td>' +
          (pet.attack != null ? pet.attack : '-') + '</td><td>' + (pet.defense != null ? pet.defense : '-') + '</td><td>' + acquire + '</td></tr>';
      }).join('');

      var prevWrap = content.querySelector('.table-wrap');
      var prevScrollLeft = prevWrap ? prevWrap.scrollLeft : 0;

      content.innerHTML =
        '<h2>' + escapeHtml(p.name) + ' - Lv.' + (p.level != null ? p.level : '-') +
        '(所持モンスター' + pets.length + '/' + allPets.length + '体) ' + realtimeBadge + '</h2>' +
        '<div class="table-wrap"><table><thead><tr>' + headerHtml + '</tr></thead><tbody>' +
        (rowsHtml || '<tr><td colspan="10" class="empty">該当するモンスターがありません</td></tr>') +
        '</tbody></table></div>';

      var newWrap = content.querySelector('.table-wrap');
      if (newWrap) newWrap.scrollLeft = prevScrollLeft;

      Array.prototype.forEach.call(content.querySelectorAll('th.sortable'), function (th) {
        th.addEventListener('click', function () {
          var key = th.dataset.key;
          if (sortKey === key) { sortDir = -sortDir; } else { sortKey = key; sortDir = 1; }
          renderContent();
        });
      });
    }

    document.getElementById('searchInput').addEventListener('input', renderContent);

    renderTabs();
    renderContent();
  })();
  </script>
