<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鍛冶レシピ - DQMⅥ</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; background:#f9f9f7; color:#0b0b0b; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .updated { color: #898781; font-size: 13px; margin-bottom: 20px; }
  .links { font-size: 13px; margin-bottom: 16px; }
  summary.section-toggle { cursor:pointer; font-size:15px; font-weight:600; margin:16px 0 10px; }
  .notice { background:#fff8e6; border:1px solid #e8d38a; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:16px; }
  .tab-buttons { display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; padding-bottom:4px; }
  .tab-btn { flex-shrink:0; padding:8px 14px; border-radius:6px; border:1px solid rgba(11,11,11,.1); background:transparent; cursor:pointer; font-size:13px; font-family:inherit; }
  .tab-btn.active { background:#fcfcfb; border-color:#52514e; font-weight:600; }
  .controls { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  input[type=search] { padding:6px 10px; border:1px solid rgba(11,11,11,.1); border-radius:6px; font-size:13px; min-width:220px; font-family:inherit; }
  .badge { display:inline-flex; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid currentColor; color:#898781; }
  .empty { color: #898781; }
  .entry { background:#fcfcfb; border:1px solid rgba(11,11,11,.1); border-radius:10px; padding:10px 14px; margin-bottom:8px; }
  .entry summary { cursor:pointer; font-size:14px; }
  .entry-stats { font-size:13px; color:#52514e; margin-top:8px; line-height:1.7; }
  .boss-rotation { font-size:13px; margin:6px 0 0; padding-left:20px; }
  .boss-rotation li { margin-bottom:2px; }
  .guide-section { margin-bottom:18px; }
  .guide-section h2 { font-size:15px; margin:0 0 8px; }
  .guide-section h3 { font-size:13px; color:#52514e; margin:12px 0 6px; }
</style>
</head>
<body>
  <h1>鍛冶レシピ(全0件)</h1>
  <p class="updated" id="updated"></p>
  <p class="links"><a href="index.html">← 配合表トップへ</a> ・ <a href="monsters.html">モンスター図鑑</a> ・ <a href="bosses.html">ボス攻略</a> ・ <a href="guide.html">冒険ガイド</a> ・ <a href="jobs.html">職業スキル</a> ・ <a href="structures.html">建築物カタログ</a> ・ <a href="fishing.html">釣り交換所</a> ・ <a href="gambits.html">ガンビット解説</a> ・ <a href="smithing.html">鍛冶レシピ</a></p>
  <div class="tab-buttons" id="categoryTabs"></div>
  <div class="controls">
    <input type="search" id="searchInput" placeholder="完成品名・材料名で絞り込み">
  </div>
  <div id="content"></div>

  <script id="page-data" type="application/json">{"recipes":[],"generatedAt":"2026/08/29 12:58:40"}</script>
  <script>
  (function () {
    var data = JSON.parse(document.getElementById('page-data').textContent);
    var recipes = data.recipes;
    document.getElementById('updated').textContent = '最終更新: ' + data.generatedAt;

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    var categories = ['all'].concat(
      recipes.map(function (r) { return r.mainCategory; })
        .filter(function (c, i, arr) { return c && arr.indexOf(c) === i; })
        .sort()
    );
    var activeCategory = 'all';

    function renderTabs() {
      document.getElementById('categoryTabs').innerHTML = categories.map(function (c) {
        var label = c === 'all' ? '全カテゴリ' : c;
        return '<button class="tab-btn' + (c === activeCategory ? ' active' : '') + '" data-cat="' + escapeHtml(c) + '">' + escapeHtml(label) + '</button>';
      }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('#categoryTabs .tab-btn'), function (btn) {
        btn.addEventListener('click', function () {
          activeCategory = btn.dataset.cat;
          renderTabs();
          render();
        });
      });
    }

    function render() {
      var query = document.getElementById('searchInput').value.trim().toLowerCase();
      var html = recipes.filter(function (r) {
        if (activeCategory !== 'all' && r.mainCategory !== activeCategory) return false;
        if (!query) return true;
        var materialsText = r.materials.map(function (m) { return m.displayName; }).join('、').toLowerCase();
        return r.displayName.toLowerCase().indexOf(query) !== -1 || materialsText.indexOf(query) !== -1;
      }).map(function (r) {
        var materialsHtml = r.materials.map(function (m) {
          return '<li>' + escapeHtml(m.displayName) + ' ×' + m.count + '</li>';
        }).join('');
        var levelHtml = r.requiredSmithingLevel ? '必要鍛冶レベル: ' + r.requiredSmithingLevel + '<br>' : '';
        var statHtml = (r.attack || r.defense) ? ('攻撃+' + (r.attack || 0) + ' 守備+' + (r.defense || 0) + '<br>') : '';
        return '<details class="entry" id="recipe-' + escapeHtml(r.id) + '"><summary><strong>' + escapeHtml(r.displayName) +
          '</strong> <span class="badge">' + escapeHtml(r.mainCategory || '-') + (r.subCategory ? '/' + escapeHtml(r.subCategory) : '') + '</span></summary>' +
          '<div class="entry-stats">' + levelHtml + statHtml + '完成数: ' + (r.resultCount || 1) + '<br>材料:<ul class="boss-rotation">' + materialsHtml + '</ul>' +
          (r.effect ? '備考: ' + escapeHtml(r.effect) : '') + '</div></details>';
      }).join('');
      document.getElementById('content').innerHTML = html || '<div class="empty">該当するレシピがありません</div>';
    }

    document.getElementById('searchInput').addEventListener('input', render);
    renderTabs();
    render();

    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target && target.tagName === 'DETAILS') {
        target.open = true;
        target.scrollIntoView();
      }
    }
  })();
  </script>
</body>
</html>
