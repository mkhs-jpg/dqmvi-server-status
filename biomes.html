<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バイオーム図鑑 - DQMⅥ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Outfit:wght@200;300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#070912; --ink:#eceffa; --muted:#8d95b2;
    --gold:#e3c07d; --gold-lt:#f7e3b8; --violet:#6b5cff; --cyan:#49d8d0;
    --line:rgba(255,255,255,.10); --surface:rgba(255,255,255,.035);
  }
  * { box-sizing: border-box; }
  body { font-family: 'Zen Kaku Gothic New', 'Outfit', system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; background:var(--bg); color:var(--ink); }
  h1 { font-size: 20px; margin-bottom: 4px; font-weight:700; }
  a { color: var(--gold-lt); }
  .updated { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .links { font-size: 13px; margin-bottom: 16px; color: var(--muted); }
  .links a { color: var(--gold); text-decoration:none; }
  .links a:hover { color: var(--gold-lt); text-decoration:underline; }
  summary.section-toggle { cursor:pointer; font-size:15px; font-weight:700; margin:16px 0 10px; color: var(--ink); }
  .notice { background:rgba(227,192,125,.08); border:1px solid rgba(227,192,125,.35); border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:16px; color: var(--ink); }
  .tab-buttons { display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; padding-bottom:4px; }
  .tab-btn { flex-shrink:0; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; font-size:13px; font-family:inherit; }
  .tab-btn.active { background:var(--gold); border-color:var(--gold); color:#1a1506; font-weight:700; }
  .controls { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  input[type=search] { padding:7px 12px; border:1px solid var(--line); border-radius:10px; font-size:13px; min-width:220px; font-family:inherit; background:var(--surface); color:var(--ink); }
  input[type=search]::placeholder { color: var(--muted); }
  input[type=search]:focus { outline:none; border-color:var(--gold); }
  .badge { display:inline-flex; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid var(--gold); color:var(--gold-lt); }
  .empty { color: var(--muted); }
  .entry { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 14px; margin-bottom:8px; }
  .entry summary { cursor:pointer; font-size:14px; color:var(--ink); }
  .entry-stats { font-size:13px; color:var(--muted); margin-top:8px; line-height:1.7; }
  .boss-rotation { font-size:13px; margin:6px 0 0; padding-left:20px; }
  .boss-rotation li { margin-bottom:2px; }
  .guide-section { margin-bottom:18px; }
  .guide-section h2 { font-size:15px; margin:0 0 8px; color:var(--ink); }
  .guide-section h3 { font-size:13px; color:var(--muted); margin:12px 0 6px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }

  .rank-tiers-table td.num, .rank-tiers-table th.num { text-align: right; }
</style>
</head>
<body>
  <h1>バイオーム図鑑(全16種)</h1>
  <p class="updated" id="updated"></p>
  <p class="links"><a href="index.html">配合表トップ</a> ＞ <a href="wiki.html">攻略Wiki</a> ＞ バイオーム図鑑</p>

  <div class="guide-section">
    <h2>バイオームランクの上がり方</h2>
    <p style="font-size:13px; color:var(--muted); line-height:1.7;">
      これまでに足を踏み入れて発見したバイオームの種類数(ワールド全体で共有)が「進行度」になる。
      進行度が増えるほど、新しく踏み込むバイオームで出現するモンスターの強さ(レベルボーナス、乱数で加算)と
      レア度が下表のとおり段階的に上がっていく。
    </p>
    <div class="table-wrap" id="rankTiersTable"></div>
  </div>

  <div class="controls">
    <input type="search" id="searchInput" placeholder="バイオーム名・特徴で絞り込み">
  </div>
  <div id="content"></div>

  <script id="page-data" type="application/json">{"biomes":[{"id":"obake_mushroom_forest","name":"おばけキノコの森","temperature":0.7,"downfall":0.8,"hasPrecipitation":true,"features":["巨大キノコ","キノコの地表"]},{"id":"chimera_cliffs","name":"キメラの断崖","temperature":0.4,"downfall":0.6,"hasPrecipitation":true,"features":["断崖の石柱"]},{"id":"ghost_mist_forest","name":"ゴースト霧森","temperature":0.35,"downfall":0.7,"hasPrecipitation":true,"features":["幽霊の墓地","霧の地表"]},{"id":"moai_rock_ruins","name":"ゴーレム岩石遺跡","temperature":0.6,"downfall":0.2,"hasPrecipitation":true,"features":["モアイ像","岩石質の地表"]},{"id":"slime_marsh","name":"スライム湿原","temperature":0.75,"downfall":0.95,"hasPrecipitation":true,"features":["スライムの丘","湿地の地表"]},{"id":"tamagoron_grassland","name":"タマゴロン草原","temperature":0.8,"downfall":0.45,"hasPrecipitation":true,"features":["卵石"]},{"id":"dragon_volcanic_belt","name":"ドラゴン火山帯","temperature":1.95,"downfall":0.08,"hasPrecipitation":false,"features":["火山","溶岩質の地表"]},{"id":"mimic_treasure_hollow","name":"ミミックの宝物窟","temperature":0.8,"downfall":0.4,"hasPrecipitation":true,"features":["宝箱"]},{"id":"golden_desert","name":"黄金の砂漠","temperature":2,"downfall":0,"hasPrecipitation":false,"features":["砂のピラミッド","黄金の地表"]},{"id":"sunken_monster_sea","name":"沈没魔物海","temperature":0.45,"downfall":0.6,"hasPrecipitation":true,"features":["海底遺跡"]},{"id":"poison_marsh","name":"毒の大湿地","temperature":0.75,"downfall":0.95,"hasPrecipitation":true,"features":["毒の地表"]},{"id":"frozen_spike_plain","name":"氷結のトゲ平原","temperature":0,"downfall":0.5,"hasPrecipitation":true,"features":["氷の尖塔","凍った地表"]},{"id":"demon_lord_scorched_land","name":"魔王の焦土","temperature":2,"downfall":0,"hasPrecipitation":false,"features":["黒曜石の尖塔","焦げた地表"]},{"id":"monster_bone_wasteland","name":"魔物の骨荒野","temperature":1.8,"downfall":0.02,"hasPrecipitation":false,"features":["骨のアーチ","骨まじりの砂地"]},{"id":"magic_forest","name":"魔法の森","temperature":0.7,"downfall":0.8,"hasPrecipitation":true,"features":["浮遊島"]},{"id":"fairy_flower_field","name":"妖精の花畑","temperature":0.7,"downfall":0.8,"hasPrecipitation":true,"features":["巨大な花"]}],"rankTiers":[{"minDiscoveryOrder":0,"label":"未発見/未設定","spawnBandLabel":"現在地相応","minLevelBonus":0,"maxLevelBonus":0},{"minDiscoveryOrder":1,"label":"発見1〜8番目","spawnBandLabel":"よく出現","minLevelBonus":0,"maxLevelBonus":7},{"minDiscoveryOrder":9,"label":"発見9〜16番目","spawnBandLabel":"やや珍しい","minLevelBonus":8,"maxLevelBonus":15},{"minDiscoveryOrder":17,"label":"発見17〜24番目","spawnBandLabel":"珍しい","minLevelBonus":16,"maxLevelBonus":23},{"minDiscoveryOrder":25,"label":"発見25〜32番目","spawnBandLabel":"珍しい・強め","minLevelBonus":24,"maxLevelBonus":31},{"minDiscoveryOrder":33,"label":"発見33〜45番目","spawnBandLabel":"強敵","minLevelBonus":32,"maxLevelBonus":44},{"minDiscoveryOrder":46,"label":"発見46〜60番目","spawnBandLabel":"強敵・レア","minLevelBonus":45,"maxLevelBonus":59},{"minDiscoveryOrder":61,"label":"発見61〜80番目","spawnBandLabel":"レア","minLevelBonus":60,"maxLevelBonus":80},{"minDiscoveryOrder":81,"label":"発見81番目以降","spawnBandLabel":"レア・伝説級","minLevelBonus":80,"maxLevelBonus":90},{"minDiscoveryOrder":100,"label":"発見100番目以降","spawnBandLabel":"伝説級","minLevelBonus":90,"maxLevelBonus":98}],"generatedAt":"2026/09/08 00:08:11"}</script>
  <script>
  (function () {
    var data = JSON.parse(document.getElementById('page-data').textContent);
    var biomes = data.biomes;
    var rankTiers = data.rankTiers;
    document.getElementById('updated').textContent = '最終更新: ' + data.generatedAt;
    
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
    function expandHashDetails() {
      if (!location.hash) return;
      var target = document.querySelector(location.hash);
      if (target && target.tagName === 'DETAILS') {
        target.open = true;
        target.scrollIntoView();
      }
    }


    document.getElementById('rankTiersTable').innerHTML =
      '<table class="rank-tiers-table"><thead><tr><th>発見バイオーム数</th><th>出現傾向</th><th class="num">レベルボーナス</th></tr></thead><tbody>' +
      rankTiers.map(function (t) {
        var bonus = (t.minLevelBonus === 0 && t.maxLevelBonus === 0) ? '±0' : ('+' + t.minLevelBonus + '〜+' + t.maxLevelBonus);
        return '<tr><td>' + escapeHtml(t.label) + '</td><td>' + escapeHtml(t.spawnBandLabel) + '</td><td class="num">' + bonus + '</td></tr>';
      }).join('') + '</tbody></table>';

    function render() {
      var query = document.getElementById('searchInput').value.trim().toLowerCase();
      var html = biomes.filter(function (b) {
        if (!query) return true;
        return b.name.toLowerCase().indexOf(query) !== -1 ||
          b.features.join('、').toLowerCase().indexOf(query) !== -1;
      }).map(function (b) {
        var featuresHtml = b.features.length
          ? b.features.map(function (f) { return escapeHtml(f); }).join('、')
          : 'なし';
        return '<details class="entry" id="biome-' + escapeHtml(b.id) + '"><summary><strong>' + escapeHtml(b.name) + '</strong></summary>' +
          '<div class="entry-stats">' +
          '<h3>気候</h3><p>気温 ' + b.temperature + ' ／ 降水量 ' + b.downfall + ' ／ 降水: ' + (b.hasPrecipitation ? 'あり' : 'なし') + '</p>' +
          '<h3>特徴的な地形</h3><p>' + featuresHtml + '</p>' +
          '</div></details>';
      }).join('');
      document.getElementById('content').innerHTML = html || '<div class="empty">該当するバイオームがありません</div>';
    }

    document.getElementById('searchInput').addEventListener('input', render);
    render();

    expandHashDetails();
  })();
  </script>
</body>
</html>
