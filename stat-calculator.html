<html lang="ja">
<head>

<style>
  :root {
    --bg:#070912; --ink:#eceffa; --muted:#8d95b2;

  * { box-sizing: border-box; }
  body { font-family: 'Zen Kaku Gothic New', 'Outfit', system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; background:var(--bg); color:var(--ink); }
  h1 { font-size: 20px; margin-bottom: 4px; font-weight:700; }
  a { color: var(--gold-lt); }
  .updated { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .links { font-size: 13px; margin-bottom: 16px; color: var(--muted); }
  .links a { color: var(--gold); text-decoration:none; }
  .links a:hover { color: var(--gold-lt); text-decoration:underline; }
  summary.section-toggle { cursor:pointer; font-size:15px; font-weight:700; margin:16px 0 10px; color: var(--ink); }
  .notice { background:rgba(227,192,125,.08); border:1px solid rgba(227,192,125,.35); border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:16px; color: var(--ink); }
  .tab-buttons { display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; padding-bottom:4px; }
  .tab-btn { flex-shrink:0; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; font-size:13px; font-family:inherit; }
  .tab-btn.active { background:var(--gold); border-color:var(--gold); color:#1a1506; font-weight:700; }
  .controls { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  input[type=search] { padding:7px 12px; border:1px solid var(--line); border-radius:10px; font-size:13px; min-width:220px; font-family:inherit; background:var(--surface); color:var(--ink); }

  input[type=search]:focus { outline:none; border-color:var(--gold); }
  .badge { display:inline-flex; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid var(--gold); color:var(--gold-lt); }
  .empty { color: var(--muted); }
  .entry { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 14px; margin-bottom:8px; }
  .entry summary { cursor:pointer; font-size:14px; color:var(--ink); }
  .entry-stats { font-size:13px; color:var(--muted); margin-top:8px; line-height:1.7; }
  .boss-rotation { font-size:13px; margin:6px 0 0; padding-left:20px; }
  .boss-rotation li { margin-bottom:2px; }
  .guide-section { margin-bottom:18px; }
  .guide-section h2 { font-size:15px; margin:0 0 8px; color:var(--ink); }
  .guide-section h3 { font-size:13px; color:var(--muted); margin:12px 0 6px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }

  .parent-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; margin-bottom:16px; }
  .parent-card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; min-width:0; }
  .parent-card h3 { margin:0 0 10px; font-size:14px; color:var(--gold-lt); }
  .field-row { display:grid; grid-template-columns:90px minmax(0,1fr); align-items:center; gap:8px; margin-bottom:8px; font-size:13px; min-width:0; }
  .field-row label { color:var(--muted); }
  .field-row input, .field-row select { min-width:0; width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.04); color:var(--ink); font-family:inherit; font-size:13px; box-sizing:border-box; }

  .stat-grid .field-row { min-width:0; grid-template-columns:56px minmax(0,1fr); }
  .btn { padding:8px 16px; border-radius:10px; border:1px solid var(--gold); background:var(--gold); color:#1a1506; font-weight:700; cursor:pointer; font-size:13px; font-family:inherit; }
  .btn:hover { background:var(--gold-lt); }
  .btn-sub { background:transparent; color:var(--gold); margin-bottom:8px; }
  .scenario-card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:10px; }
  .scenario-card h4 { margin:0 0 8px; font-size:13.5px; color:var(--ink); font-weight:600; }
  .candidate-group { margin-bottom:6px; font-size:13px; }
  .candidate-group .role { color:var(--gold); font-weight:600; }
  .candidate-pill { display:inline-block; padding:3px 10px; margin:2px 4px 2px 0; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.03); cursor:pointer; font-size:12.5px; }
  .candidate-pill:hover, .candidate-pill.selected { border-color:var(--gold); color:var(--gold-lt); }
  .result-box { background:rgba(227,192,125,.07); border:1px solid rgba(227,192,125,.3); border-radius:14px; padding:14px 16px; margin-top:12px; font-size:13px; }

  .calc-section { margin-bottom:22px; }
</style>
</head>

  <h1>ステータス計算機</h1>
  <p class="updated" id="updated"></p>
  <p class="links"><a href="index.html">配合表トップ</a> ＞ <a href="wiki.html">攻略Wiki</a> ＞ ステータス計算機</p>
  <p class="notice">MOD本体(DQMVI-*.jar)を逆アセンブルして復元した、実際のステータス成長式・配合式に基づく計算機です。乱数でその都度決まる値は「平均的な期待値」で表示しています(実際の個体は多少前後します)。守備・魔守備は「メタル」系統以外、配合時は個体差でなく同ランクの平均値を使う仕様です。</p>

    <div id="levelupResult"></div>
  </section>

  <script>
  (function () {
    var data = JSON.parse(document.getElementById('page-data').textContent);
    document.getElementById('updated').textContent = '最終更新: ' + data.generatedAt;
    
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];

        target.open = true;

      return '<option value="' + escapeHtml(m.name) + '">';
    }).join('');

    var STAT_KEYS = ['hp', 'mp', 'attack', 'magicPower', 'defense', 'magicDefense'];
    var STAT_LABELS = { hp: 'HP', mp: 'MP', attack: '攻撃', magicPower: '魔力', defense: '守備', magicDefense: '魔守備' };
    var PERSONALITY_TARGET = { '攻撃型': 'attack', '防御型': 'defense', '支援型': 'mp', '魔法型': 'magicPower', '護衛型': 'hp', '慎重型': 'magicDefense' };

    function rangeAverage(r) { return r ? (r.min + r.max) / 2 : 0; }

    function personalityOptionsHtml() {
      return '<option value="">(不明・指定なし)</option>' + personalities.map(function (p) {
        return '<option value="' + escapeHtml(p.type) + '">' + escapeHtml(p.displayName) + '(' + escapeHtml(p.type) + ')</option>';
      }).join('');
    }

    // HP成長は、メタル系以外は種族を問わずレベル帯共通テーブル(com/dqm/data/
    // DqmvPetHpGrowthBands、pet_hp_growth.tsv)を使う仕様(usesBands()==!isMetal)。
    // SPECSのgrowth.hpレンジが実際に使われるのはメタル系のみ。
    var hpGrowthBands = data.hpGrowthBands || [];
    function hpBandFor(level) {
      for (var i = 0; i < hpGrowthBands.length; i++) {
        var b = hpGrowthBands[i];
        if (level >= b.minLevel && level <= b.maxLevel) return b;
      }
      return hpGrowthBands.length ? hpGrowthBands[hpGrowthBands.length - 1] : null;
    }
    // DqmvPetHpGrowthBands.totalAverage(level)の再現。レベル2〜levelの各レベルで
    // そのレベル帯の平均上昇幅を合計する(レベル1→2の成長から数える)。
    function hpGrowthTotalAverage(level) {
      var total = 0;
      for (var lv = 2; lv <= Math.max(1, level); lv++) {
        var band = hpBandFor(lv);
        if (!band) continue;
        total += Math.floor((band.min + band.max) / 2);
      }
      return total;
    }

    // レベルアップ時の期待ステータス。com/dqm/entity/DqmvPetEntity.rollPetLevelGains()の
    // 再現(乱数ロールの代わりに成長レンジの平均値を使い、性格タイプによる毎レベル固定+1
    // ボーナスも加算する。「その他(バランス型)」は6項目にランダムで1点なので期待値は1/6ずつ)。
    function statsAtLevel(monster, level, personalityType) {
      var levels = Math.max(0, level - 1);
      var result = {};
      STAT_KEYS.forEach(function (key) {
        var initAvg = rangeAverage(monster.initial[key]);
        if (key === 'hp' && !monster.isMetal) {
          result.hp = initAvg + hpGrowthTotalAverage(level);
          return;
        }
        var growAvg = monster.growth ? rangeAverage(monster.growth[key]) : 0;
        result[key] = initAvg + growAvg * levels;
      });
      var target = personalityType ? PERSONALITY_TARGET[personalityType] : null;
      if (target) {
        result[target] += levels;
      } else {
        STAT_KEYS.forEach(function (key) { result[key] += levels / 6; });
      }
      STAT_KEYS.forEach(function (key) { result[key] = Math.round(result[key]); });
      return result;
    }

    // --- 親入力パネル ---
    function buildParentCardHtml(label) {

        '<button class="btn btn-sub" id="' + label + '-autofill" type="button">現在ステータスを自動計算</button>' +
        '<div class="stat-grid">' + statInputs + '</div>';
    }
    document.getElementById('parentA-card').innerHTML = buildParentCardHtml('a');
    document.getElementById('parentB-card').innerHTML = buildParentCardHtml('b');

    function wireAutofill(label) {
      document.getElementById(label + '-autofill').addEventListener('click', function () {
        var monster = monsterByName[document.getElementById(label + '-species').value.trim()];
        if (!monster) { alert('種族名を候補から選んでください'); return; }
        var level = Math.max(1, Math.min(300, Number(document.getElementById(label + '-level').value) || 1));
        var personalityType = document.getElementById(label + '-personality').value;
        var stats = statsAtLevel(monster, level, personalityType || null);
        STAT_KEYS.forEach(function (key) {
          document.getElementById(label + '-stat-' + key).value = stats[key];
        });
      });
    }
    wireAutofill('a');
    wireAutofill('b');

    function readParent(label) {
      var monster = monsterByName[document.getElementById(label + '-species').value.trim()];
      if (!monster) return null;
      var level = Math.max(1, Math.min(300, Number(document.getElementById(label + '-level').value) || 1));
      var breedCount = Math.max(0, Number(document.getElementById(label + '-breedcount').value) || 0);
      var stats = {};
      STAT_KEYS.forEach(function (key) {
        var v = document.getElementById(label + '-stat-' + key).value;
        stats[key] = v === '' ? rangeAverage(monster.initial[key]) : Number(v);
      });
      return { monster: monster, level: level, breedCount: breedCount, stats: stats };
    }

    // --- 配合先ランク・系統の決定(com/dqm/DqmvBreedingManager.buildCandidates()の再現) ---
    function resultRankOptions(rankA, rankB) {
      var sum = rankA + rankB;
      var base = Math.floor(sum / 2);
      if (sum % 2 === 1) {
        return [{ rank: Math.min(7, base), prob: 80 }, { rank: Math.min(7, base + 1), prob: 20 }];
      }
      return [{ rank: base, prob: 100 }];
    }
    function isRecessiveFamily(family) { return family === METAL_FAMILY || family === '特殊'; }
    function resultFamilyOptions(familyA, familyB) {
      if (familyA === familyB) return [{ family: familyA, prob: 100 }];
      var recA = isRecessiveFamily(familyA), recB = isRecessiveFamily(familyB);
      if (recA && recB) return [{ family: '特殊', prob: 100 }];
      if (recA) return [{ family: familyB, prob: 100 }];
      if (recB) return [{ family: familyA, prob: 100 }];
      return [{ family: familyA, prob: 50 }, { family: familyB, prob: 50 }];
    }
    function normalPoolAt(rank, family) {
      if (rank < 1 || rank > 7) return [];
      return data.normalPools[rank + '|' + family] || [];
    }
    function pickNormalPool(rank, family) {
      for (var distance = 0; distance <= 6; distance++) {
        var lower = normalPoolAt(rank - distance, family);
        if (lower.length > 0) return { rank: rank - distance, list: lower };
        if (distance > 0) {
          var upper = normalPoolAt(rank + distance, family);
          if (upper.length > 0) return { rank: rank + distance, list: upper };
        }
      }
      return null;
    }
    function rankUpPool(rank, family, steps) {
      var found = 0;
      for (var upper = rank + 1; upper <= 7; upper++) {
        var pool = normalPoolAt(upper, family);
        if (pool.length === 0) continue;
        found++;
        if (found === steps) return { rank: upper, list: pool };
      }
      return null;
    }

    function buildScenarios(parentA, parentB) {
      var rankOptions = resultRankOptions(parentA.monster.rank, parentB.monster.rank);
      var familyOptions = resultFamilyOptions(parentA.monster.family, parentB.monster.family);
      var minLevel = Math.min(parentA.level, parentB.level);
      var scenarios = [];
      rankOptions.forEach(function (ro) {
        familyOptions.forEach(function (fo) {
          var resultRank = ro.rank;
          var family = fo.family;
          var groups = [];
          var rareTotal = 0;
          var rankUp1 = rankUpPool(resultRank, family, 1);
          if (rankUp1) {
            var chance1 = minLevel >= 60 ? 30 : 5;
            groups.push({ role: 'ランク+1', rank: rankUp1.rank, chance: chance1, list: rankUp1.list });
            rareTotal += chance1;
          }
          var rankUp2 = rankUpPool(resultRank, family, 2);
          if (rankUp2) {
            var chance2 = minLevel >= 60 ? 5 : 1;
            groups.push({ role: 'ランク+2', rank: rankUp2.rank, chance: chance2, list: rankUp2.list });
            rareTotal += chance2;
          }
          var rarePool = minLevel >= 150 ? (data.tenseiPools[resultRank] || []) : [];
          if (rarePool.length > 0) {
            groups.push({ role: 'レア配合(転生)', rank: resultRank, chance: 10, list: rarePool });
            rareTotal += 10;
          }
          var normal = pickNormalPool(resultRank, family);
          if (normal) {
            groups.unshift({ role: '通常配合', rank: normal.rank, chance: Math.max(0, 100 - rareTotal), list: normal.list });
          }
          scenarios.push({ rank: resultRank, rankProb: ro.prob, family: family, familyProb: fo.prob, groups: groups });
        });
      });
      return scenarios;
    }

    // --- 配合ボーナス計算(com/dqm/DqmvBreedingManager.candidate()の再現) ---
    function breedDefenseValues(parent) {
      var monster = parent.monster;
      if (monster.family !== METAL_FAMILY) {
        var avg = data.nonMetalDefenseAverage[monster.rank];
        if (avg) {
          var grown = Math.max(0, parent.level - 1);
          return {
            defense: avg.initialDefense + avg.growthDefense * grown,
            magicDefense: avg.initialMagicDefense + avg.growthMagicDefense * grown,
          };
        }
      }
      return { defense: parent.stats.defense, magicDefense: parent.stats.magicDefense };
    }

    function computeBreedingResult(parentA, parentB, childMonster) {
      var rebirth = Math.max(parentA.breedCount, parentB.breedCount);
      var factor = 0.1 * (rebirth + 1) / (1 + 0.1 * rebirth);
      var bonus = {};
      ['hp', 'mp', 'attack', 'magicPower'].forEach(function (key) {
        bonus[key] = Math.max(0, Math.round((parentA.stats[key] + parentB.stats[key]) / 2 * factor));
      });
      var defA = breedDefenseValues(parentA), defB = breedDefenseValues(parentB);
      bonus.defense = Math.max(0, Math.round((defA.defense + defB.defense) / 2 * factor));
      bonus.magicDefense = Math.max(0, Math.round((defA.magicDefense + defB.magicDefense) / 2 * factor));

      var childInitial = {};
      var childStats = {};
      STAT_KEYS.forEach(function (key) {
        childInitial[key] = Math.round(rangeAverage(childMonster.initial[key]));
        childStats[key] = childInitial[key] + bonus[key];
      });

      var gain = Math.max(1, Math.floor((parentA.level + parentB.level) / 40));
      var childBreedCount = Math.max(parentA.breedCount, parentB.breedCount) + gain;

      return { factor: factor, bonus: bonus, childInitial: childInitial, childStats: childStats, childBreedCount: childBreedCount };
    }

    function renderChildResult(parentA, parentB, childMonster) {
      var r = computeBreedingResult(parentA, parentB, childMonster);
      var statsHtml = STAT_KEYS.map(function (key) {
        return '<tr><td>' + STAT_LABELS[key] + '</td><td>' + r.childInitial[key] + '</td><td>+' + r.bonus[key] + '</td><td><strong>' + r.childStats[key] + '</strong></td></tr>';
      }).join('');
      return '<div class="result-box"><strong>' + escapeHtml(childMonster.name) + '</strong>' +
        '(ランク' + childMonster.rank + '・' + escapeHtml(childMonster.family) + '系統)が生まれた場合の初期ステータス期待値<br>' +
        '遺伝率(配合ボーナスの係数): ' + Math.round(r.factor * 1000) / 10 + '%(今回使う配合回数+n=' + Math.max(parentA.breedCount, parentB.breedCount) + ') ／ 生まれる子の配合回数: +' + r.childBreedCount +
        '<table><thead><tr><th>ステータス</th><th>種族平均初期値</th><th>配合ボーナス</th><th>レベル1期待値</th></tr></thead><tbody>' + statsHtml + '</tbody></table></div>';
    }

    function renderScenarios(parentA, parentB) {
      var scenarios = buildScenarios(parentA, parentB);
      var html = scenarios.map(function (sc, scIndex) {
        var groupsHtml = sc.groups.map(function (g, gIndex) {
          var pills = g.list.map(function (id) {
            var m = monsterById[id];
            if (!m) return '';
            return '<span class="candidate-pill" data-sc="' + scIndex + '" data-group="' + gIndex + '" data-id="' + escapeHtml(id) + '">' + escapeHtml(m.name) + '</span>';
          }).join('');
          return '<div class="candidate-group"><span class="role">' + escapeHtml(g.role) + '(確率目安' + g.chance + '%・ランク' + g.rank + ')</span>: ' + pills + '</div>';
        }).join('');
        return '<div class="scenario-card"><h4>結果ランク' + sc.rank + '(確率' + sc.rankProb + '%) × 系統「' + escapeHtml(sc.family) + '」(確率' + sc.familyProb + '%)</h4>' + groupsHtml + '</div>';
      }).join('');
      var container = document.getElementById('breedingResult');
      container.innerHTML = '<p style="font-size:13px;color:var(--muted);">候補から子の種族をクリックすると、初期ステータス期待値を計算します(レベル150以上での転生・240以上でのボス級配合は、条件を満たしていても表示を省略しています)。</p>' + html + '<div id="childResultBox"></div>';

      Array.prototype.forEach.call(container.querySelectorAll('.candidate-pill'), function (pill) {
        pill.addEventListener('click', function () {
          Array.prototype.forEach.call(container.querySelectorAll('.candidate-pill'), function (p) { p.classList.remove('selected'); });
          pill.classList.add('selected');
          var childMonster = monsterById[pill.dataset.id];
          document.getElementById('childResultBox').innerHTML = renderChildResult(parentA, parentB, childMonster);
        });
      });
    }

    document.getElementById('breedButton').addEventListener('click', function () {
      var parentA = readParent('a');
      var parentB = readParent('b');
      if (!parentA || !parentB) { alert('親A・親Bの種族を候補から選んでください'); return; }
      if (parentA.monster.rank == null || parentB.monster.rank == null) { alert('この種族は配合ランクデータが無いため計算できません'); return; }
      renderScenarios(parentA, parentB);
    });

    // --- レベルアップ計算機 ---
    document.getElementById('lvl-personality').innerHTML = personalityOptionsHtml();
    document.getElementById('lvlButton').addEventListener('click', function () {
      var monster = monsterByName[document.getElementById('lvl-species').value.trim()];
      if (!monster) { alert('種族名を候補から選んでください'); return; }
      var level = Math.max(1, Math.min(300, Number(document.getElementById('lvl-level').value) || 1));
      var personalityType = document.getElementById('lvl-personality').value;
      var stats = statsAtLevel(monster, level, personalityType || null);
      var rows = STAT_KEYS.map(function (key) {
        return '<tr><td>' + STAT_LABELS[key] + '</td><td>' + stats[key] + '</td></tr>';
      }).join('');
      document.getElementById('levelupResult').innerHTML = '<div class="result-box"><strong>' + escapeHtml(monster.name) + '</strong> Lv' + level + ' 時点のステータス期待値' +
        '<table><thead><tr><th>ステータス</th><th>期待値</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    });

    Array.prototype.forEach.call(document.querySelectorAll('#calcTabs .tab-btn'), function (btn) {
      btn.addEventListener('click', function () {
        Array.prototype.forEach.call(document.querySelectorAll('#calcTabs .tab-btn'), function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var tab = btn.dataset.tab;
        document.getElementById('breedingSection').style.display = tab === 'breeding' ? '' : 'none';
        document.getElementById('levelupSection').style.display = tab === 'levelup' ? '' : 'none';
      });
    });
  })();
  </script>
</body>
</html>
