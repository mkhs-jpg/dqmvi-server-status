  <script>
  (function () {
    var data = JSON.parse(document.getElementById('page-data').textContent);
    var player = data.player;
    var dexMonsters = data.dexMonsters;
    document.getElementById('updated').textContent =
      '最終更新: ' + data.generatedAt + '(1時間毎に自動更新、ダッシュボードとは別の閲覧専用ページです)';

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll('[data-page-tab]'), function (btn) {
      btn.addEventListener('click', function () {
        Array.prototype.forEach.call(document.querySelectorAll('[data-page-tab]'), function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var tab = btn.dataset.pageTab;
        document.getElementById('page-tab-pets').hidden = tab !== 'pets';
        document.getElementById('page-tab-dex').hidden = tab !== 'dex';
        document.getElementById('page-tab-personality').hidden = tab !== 'personality';
      });
    });

    // --- 所持モンスター一覧 ---
    var petsSortKey = null;
    var petsSortDir = 1;
    var PETS_COLUMNS = [
      { key: 'name', label: '名前' },
      { key: 'species', label: '種族' },
      { key: 'rank', label: 'ランク' },
      { key: 'level', label: 'Lv' },
      { key: 'personality', label: '性格' },
      { key: 'personalityType', label: '傾向' },
      { key: 'skills', label: 'スキル' },
      { key: 'hp', label: 'HP' },
      { key: 'mp', label: 'MP' },
      { key: 'attack', label: '攻撃' },
      { key: 'defense', label: '防御' },
      { key: 'acquire', label: '入手' },
    ];

    // 「傾向」はレベルアップ時の成長ボーナス(HP/MP/攻撃/守備/魔力守備)と戦闘時の
    // 行動パラメータ(積極性/勇敢さ/支援/自衛/護衛)から判定される7種類のタイプ。
    // MOD内のtypeLabel()ロジックをそのまま再現したもの(サーバー側personalityTypeLabel
    // と同じ判定式)(2026-08-29)。
    var TYPE_DESCRIPTIONS = {
      '攻撃型': '積極性(aggression)と攻撃成長が高く、攻めの姿勢が強いタイプ。',
      '防御型': 'HP成長または守備成長が高く、打たれ強いタイプ。',
      '魔法型': 'MP成長と魔力守備成長が高く、魔法よりの成長をするタイプ。',
      '支援型': '支援(support)の値が高く、味方の補助を優先しやすいタイプ。',
      '護衛型': '護衛(ownerGuard)の値が高く、オーナー(プレイヤー)を守る意識が強いタイプ。',
      '慎重型': '自衛(selfPreservation)の値が高く、自分の身を守る行動を取りやすいタイプ。',
      'バランス型': '上記いずれの傾向も突出しておらず、標準的な成長・行動をするタイプ。',
    };
    var TYPE_ORDER = ['攻撃型', '防御型', '魔法型', '支援型', '護衛型', '慎重型', 'バランス型'];

    var personalitySortKey = null;
    var personalitySortDir = 1;
    var PERSONALITY_COLUMNS = [
      { key: 'displayName', label: '性格' },
      { key: 'type', label: '傾向' },
      { key: 'hpGain', label: 'HP成長' },
      { key: 'mpGain', label: 'MP成長' },
      { key: 'attackGain', label: '攻撃成長' },
      { key: 'defenseGain', label: '守備成長' },
      { key: 'magicDefenseGain', label: '魔力守備成長' },
      { key: 'aggression', label: '積極性' },
      { key: 'bravery', label: '勇敢さ' },
      { key: 'support', label: '支援' },
      { key: 'selfPreservation', label: '自衛' },
      { key: 'ownerGuard', label: '護衛' },
    ];

    function personalitySortValue(p, key) {
      var v = p[key];
      return typeof v === 'string' ? v : (v == null ? -Infinity : v);
    }

    function renderPersonalityTable() {
      var content = document.getElementById('personalityContent');
      var list = (data.personalityList || []).slice();
      if (!list.length) { content.innerHTML = ''; return; }
      if (personalitySortKey) {
        list.sort(function (a, b) {
          var va = personalitySortValue(a, personalitySortKey);
          var vb = personalitySortValue(b, personalitySortKey);
          if (va < vb) return -1 * personalitySortDir;
          if (va > vb) return 1 * personalitySortDir;
          return 0;
        });
      }
      var typeRows = TYPE_ORDER.map(function (t) {
        return '<dt>' + t + '</dt><dd>' + escapeHtml(TYPE_DESCRIPTIONS[t] || '') + '</dd>';
      }).join('');
      var headerHtml = PERSONALITY_COLUMNS.map(function (col) {
        var arrow = personalitySortKey === col.key
          ? (personalitySortDir === 1 ? ' <span class="sort-arrow active">▲</span>' : ' <span class="sort-arrow active">▼</span>')
          : ' <span class="sort-arrow">⇅</span>';
        return '<th class="sortable" data-key="' + col.key + '">' + col.label + arrow + '</th>';
      }).join('');
      var rowsHtml = list.map(function (p) {
        return '<tr><td>' + escapeHtml(p.displayName) + '</td><td>' + escapeHtml(p.type) + '</td>' +
          '<td>' + p.hpGain + '</td><td>' + p.mpGain + '</td><td>' + p.attackGain + '</td>' +
          '<td>' + p.defenseGain + '</td><td>' + p.magicDefenseGain + '</td>' +
          '<td>' + p.aggression + '</td><td>' + p.bravery + '</td><td>' + p.support + '</td>' +
          '<td>' + p.selfPreservation + '</td><td>' + p.ownerGuard + '</td></tr>';
      }).join('');

      // ソートのたびにinnerHTMLごと差し替えると横スクロール位置が失われ、右側の列
      // (積極性/勇敢さ等)を見ながらソートし直すと毎回左端に戻されてしまうため、
      // 所持モンスター一覧(renderPets)と同様に描画前後でscrollLeftを保持する(2026-08-29)。
      var prevWrap = content.querySelector('.table-wrap');
      var prevScrollLeft = prevWrap ? prevWrap.scrollLeft : 0;

      content.innerHTML = '<h2>性格・傾向について(全' + list.length + '種の一覧)</h2>' +
        '<p class="legend-intro">「性格」はモンスターごとに生成時から固定の個体特性で、レベルアップ時の' +
        '成長ボーナス(HP/MP/攻撃/守備/魔力守備)と戦闘時の行動パラメータ(積極性/勇敢さ/支援/自衛/護衛)を' +
        '持つ。「傾向」はその特性から下記の基準で判定した7分類。列見出しクリックでソートできる。</p>' +
        '<dl class="legend-intro">' + typeRows + '</dl>' +
        '<div class="table-wrap"><table><thead><tr>' + headerHtml + '</tr></thead><tbody>' +
        rowsHtml + '</tbody></table></div>';

      var newWrap = content.querySelector('.table-wrap');
      if (newWrap) newWrap.scrollLeft = prevScrollLeft;

      Array.prototype.forEach.call(content.querySelectorAll('th.sortable'), function (th) {
        th.addEventListener('click', function () {
          var key = th.dataset.key;
          if (personalitySortKey === key) { personalitySortDir = -personalitySortDir; } else { personalitySortKey = key; personalitySortDir = 1; }
          renderPersonalityTable();
        });
      });
    }

    // スキルが多い個体は横に伸び続けて見づらいため、3件ごとに改行してセルの
    // 横幅を揃える(「まほうつかいが6つくらい覚えているので上3つ下3つのような
    // 長さで」との要望)(2026-08-29)。
    function formatSkillsHtml(skills) {
      if (!skills || !skills.length) return '-';
      var lines = [];
      for (var i = 0; i < skills.length; i += 3) {
        lines.push('<div class="skill-line">' + escapeHtml(skills.slice(i, i + 3).join('、')) + '</div>');
      }
      return lines.join('');
    }

    function petSortValue(pet, key) {
      switch (key) {
        case 'name': return pet.customName || pet.nameJa || pet.variant || '';
        case 'species': return pet.species || '';
        case 'rank': return pet.rank == null ? -Infinity : pet.rank;
        case 'level': return pet.level == null ? -Infinity : pet.level;
        case 'personality': return pet.personality || '';
        case 'personalityType': return pet.personalityType || '';
        case 'skills': return (pet.skills || []).length;
        case 'hp': return pet.hp == null ? -Infinity : pet.hp;
        case 'mp': return pet.mp == null ? -Infinity : pet.mp;
        case 'attack': return pet.attack == null ? -Infinity : pet.attack;
        case 'defense': return pet.defense == null ? -Infinity : pet.defense;
        // 入手順(個体ごとの収納順の近似値)が不明なモンスターは昇順で末尾に回るようInfinityにする
        case 'acquire': return pet.acquireOrder == null ? Infinity : pet.acquireOrder;
        default: return '';
      }
    }

    function renderPets() {
      var content = document.getElementById('petsContent');
      if (!player.hasData) {
        content.innerHTML = '<p class="empty">データなし(未ログインの可能性があります)</p>';
        return;
      }

      var allPets = player.pets || [];
      var query = document.getElementById('petsSearchInput').value.trim().toLowerCase();
      var pets = allPets;
      if (query) {
        pets = allPets.filter(function (pet) {
          var name = (pet.customName || pet.nameJa || pet.variant || '').toLowerCase();
          var species = (pet.species || '').toLowerCase();
          var personality = (pet.personality || '').toLowerCase();
          var personalityType = (pet.personalityType || '').toLowerCase();
          var skills = (pet.skills || []).join('、').toLowerCase();
          return name.indexOf(query) !== -1 || species.indexOf(query) !== -1 ||
            personality.indexOf(query) !== -1 || personalityType.indexOf(query) !== -1 || skills.indexOf(query) !== -1;
        });
      }
      if (petsSortKey) {
        pets = pets.slice().sort(function (a, b) {
          var va = petSortValue(a, petsSortKey);
          var vb = petSortValue(b, petsSortKey);
          if (va < vb) return -1 * petsSortDir;
          if (va > vb) return 1 * petsSortDir;
          return 0;
        });
      }

      var realtimeBadge = player.realtime
        ? '<span class="badge good">オンライン(リアルタイム)</span>'
        : '<span class="badge">保存データ</span>';

      var headerHtml = PETS_COLUMNS.map(function (col) {
        var arrow = petsSortKey === col.key
          ? (petsSortDir === 1 ? ' <span class="sort-arrow active">▲</span>' : ' <span class="sort-arrow active">▼</span>')
          : ' <span class="sort-arrow">⇅</span>';
        return '<th class="sortable" data-key="' + col.key + '">' + col.label + arrow + '</th>';
      }).join('');

      var rowsHtml = pets.map(function (pet) {
        var name = escapeHtml(pet.customName || pet.nameJa || pet.variant || '-');
        var species = escapeHtml(pet.species || '-');
        var rank = escapeHtml(pet.rankLabel || '-');
        var personality = escapeHtml(pet.personality || '-');
        var personalityType = escapeHtml(pet.personalityType || '-');
        var skills = formatSkillsHtml(pet.skills);
        var hp = (pet.hp != null ? Math.round(pet.hp) : '-') + '/' + (pet.maxHp != null ? pet.maxHp : '-');
        var mp = (pet.mp != null ? Math.round(pet.mp) : '-') + '/' + (pet.maxMp != null ? pet.maxMp : '-');
        // capturedAtが記録されている個体は実際の検知時刻を、記録前から所持していた
        // 個体は収納順の近似値(#連番)を表示する
        var acquire = pet.capturedAt ? new Date(pet.capturedAt).toLocaleString('ja-JP')
          : (pet.acquireOrder != null ? ('#' + (pet.acquireOrder + 1)) : '-');
        return '<tr><td>' + name + '</td><td>' + species + '</td><td>' + rank + '</td><td>' + (pet.level != null ? pet.level : '-') + '</td><td>' + personality +
          '</td><td>' + personalityType + '</td><td class="skills-cell">' + skills + '</td><td>' + hp + '</td><td>' + mp + '</td><td>' +
          (pet.attack != null ? pet.attack : '-') + '</td><td>' + (pet.defense != null ? pet.defense : '-') + '</td><td>' + acquire + '</td></tr>';
      }).join('');

      var prevWrap = content.querySelector('.table-wrap');
      var prevScrollLeft = prevWrap ? prevWrap.scrollLeft : 0;

      content.innerHTML =
        '<h2>Lv.' + (player.level != null ? player.level : '-') +
        '(所持モンスター' + pets.length + '/' + allPets.length + '体) ' + realtimeBadge + '</h2>' +
        '<div class="table-wrap"><table><thead><tr>' + headerHtml + '</tr></thead><tbody>' +
        (rowsHtml || '<tr><td colspan="12" class="empty">該当するモンスターがありません</td></tr>') +
        '</tbody></table></div>';

      var newWrap = content.querySelector('.table-wrap');
      if (newWrap) newWrap.scrollLeft = prevScrollLeft;

      Array.prototype.forEach.call(content.querySelectorAll('th.sortable'), function (th) {
        th.addEventListener('click', function () {
          var key = th.dataset.key;
          if (petsSortKey === key) { petsSortDir = -petsSortDir; } else { petsSortKey = key; petsSortDir = 1; }
          renderPets();
        });
      });
    }
    document.getElementById('petsSearchInput').addEventListener('input', renderPets);

    // --- モンスター図鑑 ---
    // ステータスは個体差があるため単一の数値ではなく範囲({min,max})で保持している。
    // データが無い(SPECSに未登録の)種族はnullなので「不明」と表示する。
    function formatStatRange(r) {
      if (!r) return '不明';
      return r.min === r.max ? String(r.min) : (r.min + '〜' + r.max);
    }
    function renderDex() {
      var query = document.getElementById('dexSearchInput').value.trim().toLowerCase();
      var html = dexMonsters.map(function (m) {
        if (!m.tamed) {
          if (query) return '';
          return '<div class="dex-entry hidden-entry">#' + (m.dexOrder + 1) + ' ???</div>';
        }
        if (query) {
          var spellsText = (m.spells || []).map(function (s) { return s.name; }).join('、').toLowerCase();
          var hit = m.nameJa.toLowerCase().indexOf(query) !== -1 || spellsText.indexOf(query) !== -1;
          if (!hit) return '';
        }
        var spellsHtml = (m.spells && m.spells.length)
          ? m.spells.map(function (s) { return 'Lv' + s.level + ' ' + escapeHtml(s.name); }).join('、')
          : '(なし)';
        return '<details class="dex-entry"><summary>#' + (m.dexOrder + 1) + ' <strong>' + escapeHtml(m.nameJa) +
          '</strong><span class="badge">ランク' + escapeHtml(m.rankLabel || '-') + '</span></summary>' +
          '<div class="dex-stats">Lv1時点の目安(個体差あり): HP:' + formatStatRange(m.hp) + ' MP:' + formatStatRange(m.mp) +
          ' 攻撃:' + formatStatRange(m.attack) + ' 守備:' + formatStatRange(m.defense) +
          ' 魔力:' + formatStatRange(m.magicPower) + ' 魔守備:' + formatStatRange(m.magicDefense) +
          '<br>種族:' + escapeHtml(m.species || '-') + ' 弱点:' + escapeHtml(m.weakness || '-') + ' 出現時間帯:' + escapeHtml(m.dayTime || '-') +
          '<br>覚える呪文: ' + spellsHtml + '</div></details>';
      }).join('');
      document.getElementById('dexContent').innerHTML = html || '<div class="empty">該当するモンスターがいません</div>';
    }
    document.getElementById('dexSearchInput').addEventListener('input', renderDex);

    renderPets();
    renderDex();
    renderPersonalityTable();
  })();
  </script>
</body>
</html>
